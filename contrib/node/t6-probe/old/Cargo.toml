# T6 OK-3 D1, the old side (README.md): base-sdk's fork at the pin before OK-3, named by its
# revision. A workspace of its own, not a member, with no base SDK [patch].
[package]
name = "t6-probe-old"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
dash-params = { git = "file:///work/home/agent/workspace/base-sdk", rev = "29e01c834d3eb5d647db7eb51578350a77593847", features = ["std"] }
dash-pkc = { git = "file:///work/home/agent/workspace/base-sdk", rev = "29e01c834d3eb5d647db7eb51578350a77593847", features = ["bls", "portable", "std"] }
# dash-pow, reached through dash-primitives, needs `portable` without x86-64-v3 and AES.
dash-pow = { git = "file:///work/home/agent/workspace/base-sdk", rev = "29e01c834d3eb5d647db7eb51578350a77593847", features = ["portable"] }
dash-primitives = { git = "file:///work/home/agent/workspace/base-sdk", rev = "29e01c834d3eb5d647db7eb51578350a77593847", features = ["std"] }
dash-types = { git = "file:///work/home/agent/workspace/base-sdk", rev = "29e01c834d3eb5d647db7eb51578350a77593847", features = ["codec", "std"] }
serde_json = "1"
