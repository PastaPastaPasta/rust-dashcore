# T6 OK-3 D1, the new side (README.md): the node at OK-3's head, through the workspace's
# dash-consensus and dash-dml, on the base-sdk pin the root's [patch] names. A workspace of its
# own, not a member; its [patch] repeats the root's, as in ../../dde-probe/bs7.
[package]
name = "t6-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
dash-consensus = { path = "../../../../dash-consensus" }
dash-dml = { path = "../../../../dash-dml" }
dash-params = { package = "dash-chainparams", path = "../../../../dash-chainparams", features = ["std"] }
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "f748a78f34053c73602a0ba663d03e51def55eed", features = ["bls", "std"] }
dash-primitives = { git = "https://github.com/dashpay/base-sdk", rev = "f748a78f34053c73602a0ba663d03e51def55eed", features = ["std"] }
dash-types = { git = "https://github.com/dashpay/base-sdk", rev = "f748a78f34053c73602a0ba663d03e51def55eed", features = ["codec", "std"] }
serde_json = "1"

# On x86_64 hosts without the CPU features they need, dash-pkc's BLS (ADX) and dash-pow's X11
# (x86-64-v3 and AES), reached through dash-primitives, build only `portable`, as in the root's
# crates.
[target.'cfg(all(target_arch = "x86_64", not(target_feature = "adx")))'.dependencies]
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "f748a78f34053c73602a0ba663d03e51def55eed", features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { git = "https://github.com/dashpay/base-sdk", rev = "f748a78f34053c73602a0ba663d03e51def55eed", features = ["portable"] }

# The root Cargo.toml's table; keep them equal.
[patch."https://github.com/dashpay/base-sdk"]
dash-num = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-p2p-core = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-params = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-pkc = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-pow = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-primitives = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-script = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
dash-types = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "de0d0c7ef200f8d6ba1df2f3464d648620298898" }
