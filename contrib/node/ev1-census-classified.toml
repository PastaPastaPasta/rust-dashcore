# [[v240]]: CE7-01's reject sites at Dash Core v24.0.0 (dashpay/dash#8018), which the census pin
# predates. The census stays at its pin; ev1-census.py checks each entry against v24.0.0's own
# source and appends it as a row keyed `v24.0.0:<file>:<line>`. A `literal` entry is an `Invalid(`
# call with that class and reason. A `forward` entry is a line that contains `expression` and hands
# a NetInfoStatus back; `via` is the `Invalid(` call (class and reason as given) that turns it into
# the reason.

