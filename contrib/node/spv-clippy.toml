# Clippy bans for the SPV client library (V: SB0 §7, DEC-112 O5). V's CPU
# work runs on its host's tokio tasks (DEC-900), so rayon's global pool is
# never built; and V makes none of blst's pooled calls (DEC-79), whose pool
# dash-spv-ffi also compiles out (blst `no-threads`). V still links rayon
# through dash-chain, so parallel iterators, joins and spawns stay banned: each
# would start or run on rayon's global pool.
#
# contrib/node/check-spv.sh merges this with the root clippy.toml, the blst
# and dash-pkc entries of pure-clippy.toml (DEC-79's pooled calls, under the
# same audit stamp) and the crate's own clippy.toml, and runs clippy with
# these lints denied. `allow-invalid` keeps a crate without rayon quiet.

disallowed-methods = [
    { path = "rayon::ThreadPoolBuilder::build_global", reason = "V's CPU work runs on the host's tokio tasks; rayon's global pool is never built (SB0 §7, DEC-112 O5)", allow-invalid = true },
    { path = "rayon::spawn", reason = "this starts rayon's global pool; run the work on the host's tokio tasks (SB0 §7, DEC-112 O5)", allow-invalid = true },
    { path = "rayon::spawn_fifo", reason = "this starts rayon's global pool; run the work on the host's tokio tasks (SB0 §7, DEC-112 O5)", allow-invalid = true },
