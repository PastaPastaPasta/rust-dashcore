# Clippy bans for the SPV client library (V: SB0 §7, DEC-112 O5). V's CPU
# work runs inside the pool its host injects (dash-spv's `CpuPool`, through
# `install`), so rayon's global pool is never built; and V makes none of
# blst's pooled calls (DEC-79), whose pool dash-spv-ffi also compiles out
# (blst `no-threads`). Parallel iterators and joins run on the pool they are
# called in, rayon's global one outside an install, so they are banned too: a
# call inside `CpuPool::install` allows the lint and says so (SB13 D26).
#
# contrib/node/check-spv.sh merges this with the root clippy.toml, the blst
# and dash-pkc entries of pure-clippy.toml (DEC-79's pooled calls, under the
# same audit stamp) and the crate's own clippy.toml, and runs clippy with
# these lints denied. `allow-invalid` keeps a crate without rayon quiet.

disallowed-methods = [
    { path = "rayon::ThreadPoolBuilder::build_global", reason = "V's CPU work runs in the host's CpuPool; rayon's global pool is never built (SB0 §7, DEC-112 O5)", allow-invalid = true },
    { path = "rayon::spawn", reason = "outside a pool's install this starts rayon's global pool; use the CpuPool (SB0 §7, DEC-112 O5)", allow-invalid = true },
    { path = "rayon::spawn_fifo", reason = "outside a pool's install this starts rayon's global pool; use the CpuPool (SB0 §7, DEC-112 O5)", allow-invalid = true },
