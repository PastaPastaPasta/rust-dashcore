    { path = "rayon::join", reason = "outside a pool's install this runs on rayon's global pool; call it inside CpuPool::install and allow it there (SB0 §7, DEC-112 O5)", allow-invalid = true },
    { path = "rayon::join_context", reason = "outside a pool's install this runs on rayon's global pool; call it inside CpuPool::install and allow it there (SB0 §7, DEC-112 O5)", allow-invalid = true },
