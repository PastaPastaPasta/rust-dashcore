# Clippy bans for the libraries of the pure crates (A1 §1.5, X-1): the std
# entry points to the file system, sockets, processes, threads and the clock.
# Clippy cannot ban a whole module, so this lists the types and functions;
# `Duration` stays allowed (the time is passed in as a value).
#
# blst runs the methods listed under "Threads in blst" on its own thread pool:
# its build script enables `std`, and so the pool, on every hosted target, so
# no feature turns it off short of `no-threads`. Pure crates reach blst through
# dash-pkc, which re-exports it, so both blst's methods and dash-pkc's wrappers
# around them are banned (DEC-68/71). The lists come from blst 0.3.17's
# sources (`mt::da_pool` callers) and dash-pkc's. Clippy does not lint other
# crates' bodies, so any blst or base SDK entry point that reaches them must
# be added here. `allow-invalid` keeps crates without dash-pkc's BLS backend
# quiet; selftest-checks.sh proves every entry resolves where it is present.
#
# dash-pkc's `bls::core` verifies as Core does with serial blst calls only
# (Miller loops, the final exponentiation, hashing to G2 and point
# arithmetic), so it is not banned: it is the verify pure crates call
# (DEC-79).
#
# The audit stamp below names the blst release and the base SDK revision the
# lists were last audited against (DEC-71/79). check-pure.sh fails when a pure
# crate links another blst or the base SDK pin moves, until the lists are
# re-audited and the stamp updated: diff the base SDK between the stamped and
# the new revision for calls that reach blst's pool, in dash-pkc and in every
# base SDK library a pure crate links.
# audited: blst 0.3.17, base-sdk f26c0ed41c76128b9fe8b6288c4c13530f60df49
# contrib/node/check-pure.sh appends this to the root clippy.toml and points
# CLIPPY_CONF_DIR at the result.

