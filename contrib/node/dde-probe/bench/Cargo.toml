# (node/bsdk-bs4a-decode-domain at 0c71f50).
[package]
name = "dde-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hex = "0.4"
new-prim = { package = "dash-primitives", git = "file:///work/home/agent/workspace/base-sdk", rev = "0c71f50e4eaa1b7a3d706709eb278192591c9377", features = ["std"] }
new-types = { package = "dash-types", git = "file:///work/home/agent/workspace/base-sdk", rev = "0c71f50e4eaa1b7a3d706709eb278192591c9377", features = ["std"] }
old-prim = { package = "dash-primitives", git = "file:///work/home/agent/workspace/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", features = ["std"] }
old-types = { package = "dash-types", git = "file:///work/home/agent/workspace/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", features = ["std"] }
