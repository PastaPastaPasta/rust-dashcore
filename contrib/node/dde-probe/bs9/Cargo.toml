# Standalone tool, not a workspace member: BS9's differential of base-sdk's
# DKG, signature share, CoinJoin and governance messages against Dash
# Core's reads, from the Core-linked judge (../bs9-judge, built by ../bs8-judge/build.sh). It pins
# the base-sdk fork revision under test directly, with no [patch], so it can
# test a head before the root's pin moves to it.
[package]
name = "bs9-tool"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hex = "0.4"
serde_json = "1"
dash-p2p-core = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49", features = ["std", "serde"] }
dash-params = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-pkc = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49", features = ["std", "bls"] }
dash-primitives = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49", features = ["std", "serde"] }
dash-types = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49", features = ["std", "serde"] }

# On x86_64 hosts without the CPU features they need, dash-pkc's BLS (ADX) and dash-pow's X11
# (x86-64-v3 and AES), reached through dash-params, build only `portable`, as in the root's
# crates. This tool runs on x86_64 hosts only, beside the Core oracle.
[target.'cfg(all(target_arch = "x86_64", not(target_feature = "adx")))'.dependencies]
dash-pkc = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49", features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49", features = ["portable"] }
