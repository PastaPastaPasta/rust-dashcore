# Standalone tool, not a workspace member: BS9's differential of base-sdk's
# DKG, signature share, CoinJoin and governance messages against Dash
# Core's reads, from the Core-linked judge (../bs9-judge, built by ../bs8-judge/build.sh). It
# links the base-sdk fork pinned by the root through the [patch] below, which
# repeats the root's table as in ../bs8, and takes the chain setup and LLMQ
# templates from the node's dash-chainparams, which links the same base-sdk.
[package]
name = "bs9-tool"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
hex = "0.4"
serde_json = "1"
dash-p2p-core = { git = "https://github.com/dashpay/base-sdk", rev = "76832fafed4a8f120ef7fbf8d25dec8bbdb45c9b", features = ["std", "serde"] }
# The node's chain parameters under the path name `dash_params` (DEC-1043).
dash-params = { package = "dash-chainparams", path = "../../../../dash-chainparams", features = ["std"] }
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "76832fafed4a8f120ef7fbf8d25dec8bbdb45c9b", features = ["std", "bls"] }
dash-primitives = { git = "https://github.com/dashpay/base-sdk", rev = "76832fafed4a8f120ef7fbf8d25dec8bbdb45c9b", features = ["std", "serde"] }
dash-types = { git = "https://github.com/dashpay/base-sdk", rev = "76832fafed4a8f120ef7fbf8d25dec8bbdb45c9b", features = ["std", "serde"] }

# On x86_64 hosts without the CPU features they need, dash-pkc's BLS (ADX) and dash-pow's X11
# (x86-64-v3 and AES), reached through dash-primitives, build only `portable`, as in the root's
# crates. This tool runs on x86_64 hosts only, beside the Core oracle.
[target.'cfg(all(target_arch = "x86_64", not(target_feature = "adx")))'.dependencies]
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "76832fafed4a8f120ef7fbf8d25dec8bbdb45c9b", features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { git = "https://github.com/dashpay/base-sdk", rev = "76832fafed4a8f120ef7fbf8d25dec8bbdb45c9b", features = ["portable"] }

# The root Cargo.toml's table (which has dash-p2p-core too); keep them equal.
[patch."https://github.com/dashpay/base-sdk"]
dash-num = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-p2p-core = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-params = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-pkc = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-pow = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-primitives = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-script = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
dash-types = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "ed39410cee114d0e569b533ac300831c4122b6e9" }
