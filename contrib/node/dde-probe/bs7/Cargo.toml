# Standalone tool, not a workspace member: BS7's differential helpers. It
# links the base-sdk fork pinned by the root (BS7 is merged into it), through
# the [patch] below, which repeats the root's table as in cs2-diff and adds
# dash-p2p-core, and, with the `oracle` feature, the O1 oracle for the
# in-process `tx` and `block` targets. Build from a copy of rust-dashcore
# (`git archive HEAD`), like ../oracle, so dash-oracle-sys finds its workspace.
# The `oracle` feature also links CS0's dash-consensus.
[package]
name = "bs7-tool"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
oracle = ["dep:dash-oracle-sys", "dep:dash-consensus"]

[dependencies]
hex = "0.4"
serde_json = "1"
dash-p2p-core = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", features = ["std", "serde"] }
dash-primitives = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", features = ["std", "serde"] }
dash-types = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", features = ["std", "serde"] }
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", features = ["std"] }
dash-oracle-sys = { path = "../../../../dash-oracle-sys", features = ["oracle"], optional = true }
dash-consensus = { path = "../../../../dash-consensus", optional = true }

# On x86_64 hosts without the CPU features they need, dash-pkc's BLS (ADX) and dash-pow's X11
# (x86-64-v3 and AES), reached through dash-primitives, build only `portable`, as in the root's
# crates. This tool runs on x86_64 hosts only, beside the Core oracle.
[target.'cfg(all(target_arch = "x86_64", not(target_feature = "adx")))'.dependencies]
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { git = "https://github.com/dashpay/base-sdk", rev = "89828032b6be3341cafda0ce433c010a23217b39", features = ["portable"] }

# The root Cargo.toml's table (which has dash-p2p-core too); keep them equal.
[patch."https://github.com/dashpay/base-sdk"]
dash-num = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-params = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-pkc = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-pow = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-primitives = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-types = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
dash-p2p-core = { git = "https://github.com/PastaPastaPasta/base-sdk", rev = "f26c0ed41c76128b9fe8b6288c4c13530f60df49" }
