# The D19 pair table of EV1 (designs/EV1-specialtx.md §6.2, D19, D52), at Dash Core v24.0.0-rc.4.
#
# [[table]]: one per §3 check table, with Core's steps in execution order, each "<step> <reasons>"
# (one step can end in either of two reasons), and `loops`, the steps that name a list element
# (D19's per-element loops, and the duplicate checks over a list). Steps are labelled `<table>:<step>` with §3's step
# numbers; `ns:` steps are `CheckNetInfo` statuses, `cv:` the covenant's checks.
#
# Steps that `diff_check_special_tx` does not drive are listed with the Core reason why:
#   [[unreachable]]  no input reaches the step;
#   [[elsewhere]]    the target's world (regtest, DIP3 enforced, CheckSpecialTx only) does not
#                    reach it; `tests` names the tests that do (`file::fn`).
#
# Pairs of driven steps: every unordered pair of one table whose reasons differ must be reached by
# `node-l1/tests/l1_specialtx.rs::pairs_first_reject_d19` (Core's first reject, ours equal), except
#   [[infeasible]]   pairs whose conditions cannot hold together, with the Core reason why (the
#                    L1 test fails if one is reached, so a stale entry is noticed);
#   [[equal-string]] pairs with the same reasons, which a verdict cannot tell apart. The script
#                    computes them all; the ones the design names are listed to check that.
#
#   [[world]]        pairs Core allows that the target's world (D48) does not hold, with what it
#                    lacks (counted and checked like infeasible ones).
#
# `contrib/node/ev1-census.py --pairs` validates this file against the census. Restricted shape
# (D29): `key = "string"` or `key = [` with one string per line, so the L1 test reads it with a
# line parser.

