[[unreachable]]
steps = [
  "1t:7",
]
why = "the ProRegTx reader sets the key's scheme from nVersion (providertx.h rc.4:180), so IsLegacy() == (nVersion == LegacyBLS) for every decoded payload"

[[unreachable]]
steps = [
  "1t:9",
  "nf:1",
]
why = "the ProRegTx reader picks the NetInfo kind from nVersion >= ExtAddr (providertx.h rc.4:177-178) and always builds one, so CanStorePlatform() == (nVersion >= ExtAddr) for every decoded payload"

[[unreachable]]
steps = [
  "1p:type",
  "2p:type",
  "3p:type",
  "4p:type",
]
why = "CheckSpecialTx dispatches on nType (specialtxman.cpp rc.4:232), so GetValidatedPayload<T> only runs for T's own type and its type check (rc.4:1162-1163) never fails there"

[[unreachable]]
steps = [
  "2t:2",
]
why = "the ProUpServTx reader reads nType only from BasicBLS (providertx.h rc.4:279-282), so a version-1 payload is Regular"

[[unreachable]]
steps = [
  "2t:4",
]
why = "the ProUpServTx reader picks the NetInfo kind from nVersion >= ExtAddr (providertx.h rc.4:285-286) and always builds one, so CanStorePlatform() == (nVersion >= ExtAddr) for every decoded payload"

[[unreachable]]
steps = [
  "2c:9b",
]
why = "CheckProviderNetworkFields (2c:2, specialtxman.cpp rc.4:1393-1396) has already refused an ExtNetInfo entry that is neither AddrPort nor DomainPort (ns:malformed), and a legacy entry holding an invalid service reads as empty, which IsTriviallyValid refuses (2t:5, providertx.cpp rc.4:421-423)"

[[unreachable]]
steps = [
  "1c:8b",
]
why = "CheckProviderNetworkFields (1c:4) has already refused an ExtNetInfo entry that is neither AddrPort nor DomainPort: Validate()'s default status for it is Malformed (netinfo.cpp rc.4:607), bad-protx-netinfo-bad (ns:malformed); a legacy entry holding an invalid service reads as empty, so the loop has no entry (specialtxman.cpp rc.4:1296-1307)"

[[unreachable]]
steps = [
  "3t:4",
]
why = "the ProUpRegTx reader sets the key's scheme from nVersion (providertx.h rc.4:346), so IsLegacy() == (nVersion == LegacyBLS) for every decoded payload"

[[unreachable]]
steps = [
  "10l:1",
]
why = "CheckProDisTx refuses a masternode missing from the same list with bad-prodis-hash (10c:3, specialtxman.cpp rc.4:1870) before it calls CheckProDisTxForList; the second check (rc.4:1741) serves the mempool path's list"

[[unreachable]]
steps = [
  "11c:6",
]
why = "IsTriviallyValid admits only a P2PKH or P2SH scriptReward (11t:3), and ExtractDestination decodes both (specialtxman.cpp rc.4:1652)"

[[unreachable]]
steps = [
  "12t:3",
]
why = "the ProUpSharedRegTx reader reads the key under the basic scheme (providertx.h rc.4:534), so IsLegacy() is false for every decoded payload"

[[unreachable]]
steps = [
  "pl:2d",
  "sl:3e.ii",
]
why = "IsValidPayoutScript (providertx.cpp rc.4:20-23) admits only P2PKH and P2SH, which ExtractDestination always decodes"

[[unreachable]]
steps = [
  "ns:addr",
]
why = "Validate() never returns BadAddress: MnNetInfo checks IsTriviallyValid first, which needs a valid CService; ExtNetInfo validates only what GetAddrPort returns, and an entry holds a CService only when it is valid (census row providertx.cpp:191)"

[[unreachable]]
steps = [
  "nf:2a",
]
why = "CheckProRegTx passes allow_empty = true (specialtxman.cpp rc.4:1234); CheckProUpServTx passes false (rc.4:1393-1394), after IsTriviallyValid has refused an empty NetInfo (2t:5, providertx.cpp rc.4:421-423)"

[[unreachable]]
steps = [
  "nf:5a",
  "nf:5b",
]
why = "the ProRegTx and ProUpServTx readers read platform ports only below ExtAddr (providertx.h rc.4:217-221, 293-296), so both are 0 at version 3"

