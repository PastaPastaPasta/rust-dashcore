# FT-MAP's reviewed rules: functional-test families -> PRD story IDs (PRD §0.4 "FT-MAP").
#
# ft-map.py adds these to what it derives on its own: a story whose acceptance names the test
# (source `a`), and a story whose "Dash Core" column names an RPC the test calls or an option it
# passes (source `t`; RPCs and options most tests use are left out as framework noise). A rule is
# source `r`. Keys are fnmatch patterns over script stems; every match applies. A rule naming a
# story the PRD lacks, or matching no test at the pin, fails generation.

