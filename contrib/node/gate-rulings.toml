# The rulings two gates consume, kept with the code (DEC-987): L7, the mobile
# library's size (check-layers.py size; SB0 §2.3, DEC-170), and the shared
# crates' allocator exceptions (link-probe.py; DEC-181 (5)). The program's
# decision log stays out of this repository (DEC-986); this file holds only the
# rows these gates read, each the text of its decision-log row.
#
# A ruling counts for L7 only when it is new to the change: absent from this
# file at the merge base with node/integration and, where the decision log is
# present (~/workspace/node-program/DECISIONS.md or $NODE_PROGRAM_DECISIONS),
# its row there copied verbatim, a row the log did not have at the merge base.
# So a new L7 ruling adds its row here in the same commit as the size record
# (contrib/node/mobile-size.txt) or the layers.toml [size] change that cites
# it. link-probe.py reads this file on node/integration only, so the row an
# allocator exception's `dec` names lands there first, in a merged change of
# its own, before the exception. Rows are never edited or removed.
#
# Seeded from the decision log at node/integration c834f9e5d: the rulings any
# record or [size] constant has cited.

[rulings]
DEC-170 = ''' **SB1 gates: mechanisms, not more plant-by-plant fixes** (Sol r2, second round of the same finding classes). (1) **L7 reference is immutable.** It is the size record committed at the merge base with node/integration. When there is none (bootstrap), it is a constant in `layers.toml` (12,615,752 B: libdash_spv_ffi.so, aarch64-linux-android, release profile, NDK 29.0.14206865, API 24; citing this DEC), never `HEAD` and never a record on the branch. A change to the constant needs a new DEC id in the same commit; the checker refuses otherwise (R2-1). (2) **Rules are keyed by package name and applied to every resolved package ID with that name**, workspace or external, path, git or registry. That covers hot-path, layer and pure flags alike, with no member-only loops (R2-2; same class as r1 M1/M2). (3) **Allocator and thread checks judge the linked product, not its inputs.** For each S/P crate, build a minimal consumer binary (host and Android, features on and off) that links the crate through its normal linkage. Fail if the product defines a user global allocator (`__rg_alloc` / a non-default `__rust_alloc` provider). Build-only and proc-macro units are excluded by construction. The text and rlib scans are retired (R2-3, R2-5; third round of r1 M6). (4) **Per-target graphs come from cargo's own platform filter** (`cargo metadata --filter-platform <triple>` / `cargo tree --target`), not by mapping displayed pairs back to all resolved edges (R2-4). | 2026-10-10 |'''
DEC-298 = ''' **L7 mobile size: accept the dash-spv SQLite store's cost and re-record at T23 (manager, 2026-10-21 01:52Z).** SB1 measured libdash_spv_ffi.so (aarch64-linux-android, NDK 29.0.14206865, API 24, stripped): 12,615,752 B reference (571e6a94a), 11,785,560 B before train 20 (4c6eba229), 13,863,408 B at the train-20 merge (555794315, +2,077,848 B in one step), 13,879,768 B at 8fd57eefa. The manager re-summed SB1's per-symbol tables (/work/scratch/sb1-l7/out): ~1.67 MB of the step is symbols new in 555794315, ~1.0 MB of them named sqlite3* and most of the rest SQLite statics (parser, FTS3/FTS5, expression analysis), plus dash_kv_sqlite 28 KB and rusqlite 22 KB; tokio +97 KB is the other notable growth. This is the cost DEC-119 (SB0: SQLite for SPV and shared stores) accepted. The shipped Android unified SDK already bundles the same SQLite (rusqlite 0.38 `bundled` via Platform's shielded feature), so the real app pays the C library once; iOS can use the system libsqlite3. Ruling: (1) SB1 re-records `mobile-size.txt` at the T23 cut against the T23 merge, citing this DEC; the DEC-170 allowance is unchanged from there. (2) Trimming is BL-303 (SB13), not a gate fix. (3) Not a product decision: no shipped artefact changes. **Amendment (2026-10-21 03:37Z): the recorded value is 13,875,816 B**, libdash_spv_ffi.so at the T23 train tip 09adc9eb6, measured by SB1 with the DEC-170 profile (release, aarch64-linux-android, NDK 29.0.14206865, API 24, stripped). The DEC-170 allowance applies from this value. |'''
DEC-304 = ''' **BL-303 rulings (manager, 2026-10-21 11:13Z).** BL-303 is READY-T24 at 99d18d0ec on node/bl303-ffi-sqlite-trim (two signed commits on d66bf198f; tier 1 EXIT 0 781 s; bench_inputs 13 SAME; Opus r1/r2 accepted). (a) **Selftest waiver.** The required selftest (gate tooling changed, DEC-299) ran 331/332. The one failure, "layers.toml's [size] moved, citing a new decision that states it", fails identically at the base d66bf198f (repro /work/scratch/bl303/repro/run.sh): the DEC-298 re-record set mobile-size.txt to 13,875,816 B while layers.toml [size] still states 12,615,752 B. It is outside BL-303's diff and deterministic, so DEC-243/245's solo-pass rule does not apply. It counts as green for BL-303. SB1 fixes the case or the table in T24 (BL-310), and later selftests are judged against that fix. (b) **L7.** The new reference is 13,206,000 B (−669,816 B: FTS3/FTS5/RTREE/JSON/STAT4/SOUNDEX/column metadata/extension loading/deprecated API/shared cache dropped from the Android SQLite build; flags in contrib/mobile/android-env.sh, not .cargo/config, so PF0 and the anchor are untouched; plus a +640 B minimum-version check). SB1 records it at the T24 merge with the procedure it used for DEC-298. (c) **tokio per-task code.** Boxing `SpvStore::run`'s spawn_blocking jobs (−90,064 B) is declined for now, because it adds two allocations per store call on the PF0-measured path. BL-311 measures it under PF0 after the anchor; it is taken only if no row worsens. (d) **SQLite floor 3.34.1** (`SqliteEngine::open` refuses older): accepted for Android/Linux. On iOS it implies iOS 15 or later. agentbox has no Apple tooling, so confirming the Swift SDK deployment target goes to pasta (BL-312); macOS keeps the bundled SQLite. |'''
DEC-318 = ''' **SB2 READY ruling (manager, 2026-10-22 00:05Z).** The mobile profile goes to review at 1346c1d23: aarch64-android stripped libdash_spv_ffi 9,504,624 B (−28.0% vs release), header-path instructions not higher than release under QEMU. L7 moves to profile.mobile at 9,504,624 B (the implementer's placeholder DEC-330 becomes this row). D2 (no LTO, PLAN said fat) accepted on measurement (+6.6% instructions with fat LTO, 6 KB saved). The ≤9.0 MB target stays open as BL-328: panic=abort is a product decision for pasta (no catch_unwind in the FFI crates, but a panicking tokio task would abort the app instead of being contained); a smaller secp256k1 ecmult window trades verify speed and needs a perf ruling. The selftest L7 cases that assume the release profile (SB2 D10) are waived at SB2's train as DEC-304(a) did; BL-329 has SB1 make them read the reference environment from mobile-size.txt. |'''
DEC-330 = ''' **BL-327 Sol r1 ruling and round-2 start (manager, 2026-10-22 04:40Z).** Sol r1 on 5e8c857a7 CHANGES REQUIRED (/work/scratch/bl327-review/BL327-r1-sol.md); P4b's final head is 27e2a165f (DEC-328 delta check passed: 2 commits, tests and docs only, 39/39 mutants, tier 1 green). Round 2 per DEC-327 starts now. Major 1 (-proxy/-onlynet refused, no automatic Tor onion service under -listenonion=1, -debug=tor lines): not BL-327; these options stay with P2a-net, already recorded. BL-327's UA acceptance is the default configuration on a host with no reachable Tor control port, and D4 says so. Major 2 and Major 3 REQUIRED (they are DEC-327 items 4 and 3). Minor 4 REQUIRED: whitebind-resolve, whitelist-permission, -i2psam, -onion and ZMQ invalid-port init cases. Minor 5 REQUIRED: the CPU harness records the chain tip and request digest and compares per-command payload lengths and a canonical digest on both binaries; one counter run per side at the final head. Minor 6 → BL-338, with Windows outside the UA acceptance until then. D12: per NFR-FP-03 the p50 difference is processing latency, not a timer finding. Then a narrow Sol r2 → Opus-h. |'''
