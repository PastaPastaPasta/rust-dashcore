# v-reorg (W-small) keeps 20 kills, S7's acceptance bar (owner ruling, S8). S7 r4 leaves its path
# as it was (-dbbatchsize=20000, reorg jitter 0-50 ms), so the acceptance figures stand.
# Sized from wall per counted kill (the component's wall / its counted kills), not p95 cycle: a
# kill's cycle leaves out its boot, checks and the out-of-window kills. W-small has no long tail
# (the whole run is about a minute of blocks).
# TimeoutStartSec = 28 s a counted kill (weekly-acc/w2: 20 counted of 30 kills in 560 s wall,
# cycle p95 38.4 s) x 20 x 1.5 = 840 s
# + 600 s: the guest-lock wait (`flock -w $ST3B_VM_LOCK_WAIT`, weekly-vm.sh:265) runs inside this
# unit, so it counts against this timeout (owner ruling on S8 r2 minor 2).
# = 1,440 s, rounded up to 1,500 s.
[Service]
TimeoutStartSec=1500
