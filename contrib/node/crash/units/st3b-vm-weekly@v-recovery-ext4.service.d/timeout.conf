# v-recovery-ext4: PROVISIONAL, 6 h (S7 r2 N7). The W-small figures this once took its size from do not
# carry to W-40k: its boots load a 40k block index under -checkblockindex, every lap syncs again
# from an empty disk, and V-RECOVERY pays two boots per counted kill. The owner's acceptance run
# measures the real figure on W-40k, and S8 sizes this from the ledger's wall-s (p95 cycle x kills
# x 1.5) before it installs the timer. Until then a short week shows as a TIMEOUT row with its
# partial counts.
[Service]
TimeoutStartSec=21600
