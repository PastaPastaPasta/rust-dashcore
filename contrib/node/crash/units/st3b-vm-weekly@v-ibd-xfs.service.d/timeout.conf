# VMW6 sizing, measured 11-26 at 2e5be4a21a (PLAN-ST3b-VMW6 §3.4), out under
# /work/scratch/st3b/vmw6-measure/{m1b,m2-ibd}: a lap ends at its last counted kill, except on the
# component's to-tip week (one W-40k component a week), which adds the sync to the tip: v-ibd-ext4
# to the tip took 12,683 s at 20 kills, about 297 s a kill plus a 6,800 s tail. The timeout
# covers the to-tip week: 1.5 x (the measured wall + 6,800 s), + 600 s for the guest-lock wait
# (`flock -w $ST3B_VM_LOCK_WAIT`), which runs inside this unit. The driver's 6 h cap still bounds
# the week.
# V-IBD's position kills cost about 297 s each, so it runs 5 (10 before VMW6): m2-ibd, 5 of 5
# counted in 1,713 s.
# TimeoutStartSec = 1.5 x (1,713 + 6,800) + 600 = 13,370 s, rounded up to 13,400 s.
[Service]
Environment=ST3B_VM_KILLS_XFS=5
TimeoutStartSec=13400
