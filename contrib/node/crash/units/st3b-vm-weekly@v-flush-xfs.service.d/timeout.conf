# Routine week (owner ruling, S8): the W-40k components run 10 kills on xfs (ST3B_VM_KILLS_XFS),
# lowered from S7's one-time acceptance bar (50 ext4 / 20 xfs); v-reorg keeps 50 / 20. The
# expected routine week fits the 12 h budget at these counts, so no cut applies (README, Budgets).
# Sized from the acceptance logs as wall = kills x wall per counted kill + tail. The tail is the
# sync to the tip after the last kill, which every W-40k component ends with: about 1.1-1.6 h
# whatever the kill count (owner, S8). The kill part is the sum of the kill cycles (it matches the
# console stamps of the last kill to the second). With r4's -dbbatchsize=2000 and 5 ms flush
# jitter (S7 r4), almost every boot's first flush is killed, so the kills sit at low heights
# (about 100-900), where a boot's header re-sync is about 50 s, not the 3.4 min at the tip. A
# per-kill figure includes the first boot's header sync once (about 210 s); the 1.5 margin covers
# it at the lower routine count.
# Measured: weekly-acc/w3 at 48b5923c2: 20 counted of 20 kills, 636 s of cycles, 5,718 s wall; so
# 31.8 s a counted kill and a 5,082 s tail. Expected = 31.8 x 10 + 5,082 = 5,400 s.
# TimeoutStartSec = 5,400 x 1.5 = 8,100 s
# + 600 s: the guest-lock wait (`flock -w $ST3B_VM_LOCK_WAIT`, weekly-vm.sh:265) runs inside this
# unit, so it counts against this timeout (owner ruling on S8 r2 minor 2).
# = 8,700 s, rounded up to 8,700 s.
[Service]
Environment=ST3B_VM_KILLS_XFS=10
TimeoutStartSec=8700
