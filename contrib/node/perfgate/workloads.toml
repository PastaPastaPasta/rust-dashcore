mnlist-codec-hash         = { bench = "dash-dml/mnlist", id = "mnlist/codec_hash" }

# dash-dml: the build (EV2 §6.5 BG; PLAN EV2b), over mainnet's first 2,000 DIP3 blocks as a window
# (EV2b D29: headers and special transactions as mined, other transactions as input shapes):
# build_new_list_from_block over all of them from the default list (crit:dml_build_w1) and 10^4
# payee() calls on the last list (crit:dml_payee), each on the fast path and the reference twin
# (EV2b D24), and core_order() on that list with the cache reset (crit:dml_core_order). The fast
# build's counts vary by about 0.2% between processes (the unique map's keyed hasher). The w2 rows
# do the same over 1,371,028..1,373,027 from the list after 1,371,027 (EV2b D32: the largest list
# sampled below the oracle's 2,090,000 ceiling, with its quorums' members), a proxy for EV2's
# tip − 50k window, which waits for a snapshot source other than the oracle.
dml-build-w1-fast         = { bench = "dash-dml/dml_build", id = "dml_build/w1_fast" }
dml-build-w1-twin         = { bench = "dash-dml/dml_build", id = "dml_build/w1_twin" }
dml-payee-fast            = { bench = "dash-dml/dml_build", id = "dml_payee/fast" }
dml-payee-twin            = { bench = "dash-dml/dml_build", id = "dml_payee/twin" }
dml-core-order-fast       = { bench = "dash-dml/dml_build", id = "dml_core_order/fast" }
dml-build-w2-fast         = { bench = "dash-dml/dml_build", id = "dml_build/w2_fast" }
dml-build-w2-twin         = { bench = "dash-dml/dml_build", id = "dml_build/w2_twin" }
dml-payee-w2-fast         = { bench = "dash-dml/dml_build", id = "dml_payee/w2_fast" }
dml-payee-w2-twin         = { bench = "dash-dml/dml_build", id = "dml_payee/w2_twin" }
