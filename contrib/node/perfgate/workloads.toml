# measured C++ Core) against SmlList's cached tree after k replaced entries or one insertion (SB7 BG)
sml-root-full-5000        = { bench = "dash-evo/sml_root", id = "sml_root/full/5000" }
sml-root-incr-5000-1      = { bench = "dash-evo/sml_root", id = "sml_root/incremental/5000/1" }
