# dash-dml: the block processor (PLAN LQ2 BG, crit:qc_block; LQ2 D18): process_block with fBLSChecks
# over mainnet 2,089,770, which mines the 32 LLMQ_60_75 commitments of its cycle, with Core's members
# (the duplicate pre-pass, 32 queued signature checks, ProcessCommitment and the rows).
qc-block-mainnet          = { bench = "dash-dml/qc_block", id = "qc_block/mainnet_2089770" }
