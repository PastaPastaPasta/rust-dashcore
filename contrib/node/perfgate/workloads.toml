# PF0 counter-gate workloads (A1 §3.11). One line per workload; see README.md.
#
#   name = { bench = "<package>/<bench target>", id = "<criterion bench id>" }   # a criterion benchmark
#   name = { node = "<node-bench workload>", bin = "rdashd", args = [...] }      # a whole-node workload
#
# Optional: iters = N (pin the iteration count; otherwise calibrated on the base to ~200M instructions),
# syscalls = false (skip the strace pass). Bench IDs: `cargo bench -p <package> --bench <target> -- --list`.

[workload]
# dashcore_hashes: hashing primitives
hashes-sha256-64k     = { bench = "dashcore_hashes/hashes", id = "sha256/64k" }
hashes-sha256d-1k     = { bench = "dashcore_hashes/hashes", id = "sha256d/1k" }
hashes-sha512-64k     = { bench = "dashcore_hashes/hashes", id = "sha512/64k" }
hashes-sha1-1k        = { bench = "dashcore_hashes/hashes", id = "sha1/1k" }
hashes-ripemd160-1k   = { bench = "dashcore_hashes/hashes", id = "ripemd160/1k" }
hashes-hash160-1k     = { bench = "dashcore_hashes/hashes", id = "hash160/1k" }
hashes-hmac-sha256-1k = { bench = "dashcore_hashes/hashes", id = "hmac_sha256/1k" }
hashes-hmac-sha512-1k = { bench = "dashcore_hashes/hashes", id = "hmac_sha512/1k" }
siphash-single-16k    = { bench = "dashcore_hashes/siphash", id = "siphash24/single/16384" }
siphash-batch-16k     = { bench = "dashcore_hashes/siphash", id = "siphash24/batch/16384" }
# dash-filters: the SipHash copy the BIP158 codec hashes filter elements with (SB9; the rows above stay
# for the W crates that still use dashcore_hashes' copy, BL-78 retires one of the two).
filters-siphash-single-16k = { bench = "dash-filters/siphash", id = "siphash24/single/16384" }
filters-siphash-batch-16k  = { bench = "dash-filters/siphash", id = "siphash24/batch/16384" }

# dash-sha256: the in-repo port of Core's SHA-256 (the hashes-* rows above measure bitcoin_hashes); AVX2 is
# the fastest backend this box has (no SHA-NI), STANDARD the portable one.
sha256-standard       = { bench = "dash-sha256/sha256", id = "sha256/SHA256_STANDARD" }
sha256-avx2           = { bench = "dash-sha256/sha256", id = "sha256/SHA256_AVX2" }
sha256-32b-avx2       = { bench = "dash-sha256/sha256", id = "sha256/SHA256_32b_AVX2" }
sha256d64-1024-avx2   = { bench = "dash-sha256/sha256", id = "sha256/SHA256D64_1024_AVX2" }
dsha256-1m            = { bench = "dash-sha256/sha256", id = "sha256/DSHA256_1M" }

