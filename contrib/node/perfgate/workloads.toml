# The Rust node under node-bench's fixed-input workloads: pending until the `rdashd` binary exists.
# `measure --dashd <bin>` records the same counters for dashd. Not CPU-gated (DEC-52 4): only page faults,
# allocated bytes and peak RSS gate them; see README "Node workloads".
node-startup          = { node = "startup", bin = "rdashd" }
# ND1's genesis recipe (PF0-N §12): regtest on an empty datadir, no network, no RPC, -startupnotify ready, SIGTERM.
# Expect a shift at ND1 slice 2a (the step-7 reorder): a justified re-anchor of this row.
node-startup-genesis  = { node = "startup-genesis", bin = "rdashd" }
node-mempool-accept   = { node = "mempool-accept", bin = "rdashd", args = ["--txs", "2000"] }
node-gbt              = { node = "gbt", bin = "rdashd" }
node-rpc-getblock     = { node = "rpc", bin = "rdashd", args = ["--call", "getblock_v2", "--calls", "200"] }
