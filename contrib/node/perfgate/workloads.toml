# threshold held fixed both sides give 47,600. Stopgap until BL-103 pins the threshold for every row.
coins-fetch-db-1k         = { bench = "dashd-chainstate/coins_micro", id = "tip/fetch_db_1k", ungated = ["page_faults"] }
coins-spend-10k           = { bench = "dashd-chainstate/coins_micro", id = "tip/spend_10k" }
coins-freeze-release-100k = { bench = "dashd-chainstate/coins_micro", id = "tip/freeze_release_100k" }
coins-overlay-block-1k    = { bench = "dashd-chainstate/coins_micro", id = "overlay/block_1k" }
coins-iter-dirty-100k     = { bench = "dashd-chainstate/coins_micro", id = "layer/iter_dirty_100k" }
coins-grow-1k-to-100k     = { bench = "dashd-chainstate/coins_micro", id = "layer/grow_1k_to_100k" }

# dashd-chainstate: the flush, recovery and the open on RocksDB at -dbcache=300 (CH2 §5.7, `coins_flush`): V's
# replay of a 2,000-block synthetic churn with each block's creates, spends and spend ages from ST1's trace, and
# its shutdown flush; a 64 MiB F in 16 MiB sub-batches (W's steps asserted); an ALWAYS flush of a full coins
# share; recovery of a crash image stopped after B1; and the open of one whose large B1 is only in the log. One
# iteration each. The replay, recovery and open rows build a ~1M-coin chainstate in setup. Except the open
# row's, the databases are quiet (no automatic compactions or statistics timers, a LOG of warnings and errors
# only; D-b1-i), and each region ends with no flush or compaction left.
# Their page faults are reported, not gated: they follow when RocksDB's threads free memory that a later
# allocation could reuse, which the scheduler decides (CH2b PF0: ranges of 2-66% across 5 runs of unchanged
# code, the open row's included). Peak RSS, allocations, I/O and syscalls stay gated. Recovery's replay can meet
# a memtable-limit stop (2 of 5 diagnostic runs; DEC-164's retry), which adds a LOG warning (one write syscall)
# and up to 30 allocations (0.02%), under the floors. The shutdown row's database has memtables its flush does not
# fill, so no memtable is switched under W's writes and none can stall: with the chainstate's 16 MiB memtables, 1
# run in 4 met the memtable-limit stop and DEC-164's retry added 98-182 allocations, and DEC-164 allows no more
# than three memtables, so the row's are larger. Its peak RSS holds that 225 MiB memtable. It also leaves out the
# chainstate's charged write buffer manager, whose charging to the cache the split and replay rows still gate.
coins-replay-synth-mainnet-453371-p300 = { bench = "dashd-chainstate/coins_flush", id = "replay/synth-mainnet-453371-p300", iters = 1, ungated = ["page_faults"] }
coins-replay-synth-testnet-435990-p300 = { bench = "dashd-chainstate/coins_flush", id = "replay/synth-testnet-435990-p300", iters = 1, ungated = ["page_faults"] }
# CH2c D13: the same replays with W on its own thread (`ThreadDriver`), as the node runs them. W parks and wakes
# as the scheduler runs it, so the rows' syscalls and page faults are reported, not gated.
coins-replay-synth-mainnet-453371-thread-p300 = { bench = "dashd-chainstate/coins_flush", id = "replay/synth-mainnet-453371-thread-p300", iters = 1, ungated = ["syscalls", "page_faults"] }
coins-replay-synth-testnet-435990-thread-p300 = { bench = "dashd-chainstate/coins_flush", id = "replay/synth-testnet-435990-thread-p300", iters = 1, ungated = ["syscalls", "page_faults"] }
flush-split                            = { bench = "dashd-chainstate/coins_flush", id = "flush/split-64m", iters = 1, ungated = ["page_faults"] }
coins-shutdown-flush-p300              = { bench = "dashd-chainstate/coins_flush", id = "shutdown/always-p300", iters = 1, ungated = ["page_faults"] }
coins-recovery-mainnet                 = { bench = "dashd-chainstate/coins_flush", id = "recovery/mainnet-2000", iters = 1, ungated = ["page_faults"] }
chainstate-open                        = { bench = "dashd-chainstate/coins_flush", id = "chainstate/open-b1-256k", iters = 1, ungated = ["page_faults"] }

# dashd-chainstate: CS6's caches and script check queue (`script_checks`): 1,000 signature-cache hits (block
# connection's soft-erasing lookup), the entry and lookup a miss pays before verifying, 1,000 script-execution
# cache hits, and a block's inputs (every fourth a chain of three OP_CHECKDATASIGVERIFYs, the rest P2PKH)
# checked as -par=1 checks them, with the signature cache cold or holding every signature. The caches are
# salted with fixed nonces, so every run probes the same buckets. The queue rows run with one script-check
# thread (-par=2) at the batch boundary (127-129 inputs) and a full block (680). Pinned to one CPU, how many
# helpers start and which thread takes which batch follow the scheduler, so their instructions, allocations,
# syscalls and faults are reported, not gated; their I/O and peak RSS stay gated.
script-sigcache-hit-1k   = { bench = "dashd-chainstate/script_checks", id = "sigcache/verify_hit_1k" }
script-sigcache-miss-1k  = { bench = "dashd-chainstate/script_checks", id = "sigcache/lookup_miss_1k" }
script-exec-hit-1k       = { bench = "dashd-chainstate/script_checks", id = "exec/hit_1k" }
script-serial-16-cold    = { bench = "dashd-chainstate/script_checks", id = "serial/16_cold" }
script-serial-16-warm    = { bench = "dashd-chainstate/script_checks", id = "serial/16_warm" }
script-serial-680-cold   = { bench = "dashd-chainstate/script_checks", id = "serial/680_cold" }
script-serial-680-warm   = { bench = "dashd-chainstate/script_checks", id = "serial/680_warm" }
script-queue-127-cold    = { bench = "dashd-chainstate/script_checks", id = "queue/127_cold", ungated = ["instructions", "instructions_total", "allocs", "alloc_bytes", "syscalls", "page_faults"] }
script-queue-128-cold    = { bench = "dashd-chainstate/script_checks", id = "queue/128_cold", ungated = ["instructions", "instructions_total", "allocs", "alloc_bytes", "syscalls", "page_faults"] }
script-queue-129-cold    = { bench = "dashd-chainstate/script_checks", id = "queue/129_cold", ungated = ["instructions", "instructions_total", "allocs", "alloc_bytes", "syscalls", "page_faults"] }
script-queue-680-cold    = { bench = "dashd-chainstate/script_checks", id = "queue/680_cold", ungated = ["instructions", "instructions_total", "allocs", "alloc_bytes", "syscalls", "page_faults"] }
script-queue-680-warm    = { bench = "dashd-chainstate/script_checks", id = "queue/680_warm", ungated = ["instructions", "instructions_total", "allocs", "alloc_bytes", "syscalls", "page_faults"] }

# dashd-chainstate: CH3a's ConnectBlock, serial (-par=1), at -assumevalid off and on (`connect_block_micro`, CH3
# §6.3): one SerialCore::connect of a fixed mainnet-shaped block against a warm in-memory coins cache holding the
# coins it spends. The blocks are built in the bench (fixed keys; av-off's with RFC 6979 signatures) at mainnet
# height 630,000 (P2SH, DERSIG, CLTV, CSV) or, for the 2 MB one, 790,000 (DIP0001), under mainnet's parameters: a
# coinbase-only block; 500 P2PKH inputs; 250 P2SH 2-of-3 multisig inputs; P2PKH up to 1 MB (before DIP0001) and up
# to 2 MB; 200 transactions each spending the one before it; and two rejects measured to the failure, a missing
# coin at the last input (bad-txns-inputs-missingorspent) and a coinbase one duff over (bad-cb-amount, after the
# last transaction's inputs; under av-off, after every script). av-off checks every input's scripts, the signature
# and script caches consulted and missing as ConnectBlock never fills them; av-on names a header 10,000 blocks past
# the block as assumed valid, so no script is checked, and its block is unsigned (a placeholder at a signature's
# length, which a script check would reject). The region includes the undo record's write into a rev file on disk
# (its checksum, one statx and one pwrite64; a 1 MiB posix_fallocate, not a heap allocation, when a record crosses
# a chunk, which at the pinned iters no region reaches; the file restarts empty once its records pass 16 MiB,
# outside the region), the entry's status writes and the overlay's drop; V's bracket (the EV attempt and the
# commit, coins-overlay-block-1k) is not in it. Each iteration's setup puts the block's index entry back to
# accepted. Outside the region, each process loads a 640,000- or 800,000-entry synthetic index (~4-5 G
# instructions, most of the RSS) and, for av-off, signs the block's inputs (~0.35 G for the 500 signatures of
# p2pkh-500 or multisig-250), so instructions_total is mostly setup and stays gated, as the dash-chain lines' load
# does.
# Sixteen serial rows; these ten fit PF0's 10-minute share (CH3a D78: 110 processes, ~490 G instructions,
# 9.2 min at --jobs 4 measured at load 118-161, against an estimated 15.3 min for all sixteen measured at a faster
# per-process rate). Both sides of the two script shapes, where the scripts are most of a connect; av-on only for
# the 1 MB and 2 MB blocks (av-off is p2pkh-500's script work 11 and 21 times over, at 12.8 and 22.5 G a process),
# chained-200 and the rejects (av-off adds only the scripts the script rows gate); av-off only for the empty block
# (no input, so av-on adds only the assumed-valid lookup every other av-on row runs). Iterations are pinned at the
# calibrated counts (~120-340 M instructions in the region), so no calibration process runs; raising them on the
# 1 MB or 2 MB row past 6 or 2 brings a posix_fallocate into the region, which only instructions would show. Only
# connect-serial-empty-av-off keeps the strace pass, for the connect path's statx beside the write: the counters
# pass gates /proc io's write syscalls and bytes in every region, so a reject's undo write moved before its check
# shows there. Every region counter but instructions (page faults 0, allocs, alloc bytes, /proc io) is identical
# across processes and builds, so nothing is ungated (D79).
# -par=4 (slice a4, CH3a D131): par4/p2pkh-500/av-off is the same block with its 500 input checks queued on a
# CheckQueue of three threads beside the bench thread, all four on the one pinned CPU (its pool's size is explicit,
# so RAYON_NUM_THREADS does not shrink it): the serial row's region plus the control's queue and wait. Over 10
# processes its instructions spread by 0.04% (the workers spin and steal as the scheduler lets them) and its allocs
# by 4 of 7,188, under the 0.5% floor, so both stay gated; alloc_bytes spreads by 0.81% (the rayon job buffers
# follow the steals) and page faults by 0-3 against a 1-event floor, so those two are ungated. A par4 av-on row is
# the serial one beside three idle threads (no queue without script checks, v:2649); par4's empty/av-off and
# p2sh-multisig-250/av-off (spreads 0.02% and 0.07%) stay out of PF0's 10-minute share (about 0.9 min a row).
# With this row the eleven take about 10.1 min at D78's measured rate, about 1% over the share (D131).
connect-serial-empty-av-off            = { bench = "dashd-chainstate/connect_block_micro", id = "serial/empty/av-off", iters = 2000 }
connect-serial-p2pkh-500-av-off        = { bench = "dashd-chainstate/connect_block_micro", id = "serial/p2pkh-500/av-off", iters = 1, syscalls = false }
connect-serial-p2pkh-500-av-on         = { bench = "dashd-chainstate/connect_block_micro", id = "serial/p2pkh-500/av-on", iters = 50, syscalls = false }
connect-serial-multisig-250-av-off     = { bench = "dashd-chainstate/connect_block_micro", id = "serial/p2sh-multisig-250/av-off", iters = 1, syscalls = false }
connect-serial-multisig-250-av-on      = { bench = "dashd-chainstate/connect_block_micro", id = "serial/p2sh-multisig-250/av-on", iters = 100, syscalls = false }
connect-serial-pre-dip1-1mb-av-on      = { bench = "dashd-chainstate/connect_block_micro", id = "serial/pre-dip1-1mb/av-on", iters = 5, syscalls = false }
connect-serial-dip1-2mb-av-on          = { bench = "dashd-chainstate/connect_block_micro", id = "serial/dip1-2mb/av-on", iters = 2, syscalls = false }
connect-serial-chained-200-av-on       = { bench = "dashd-chainstate/connect_block_micro", id = "serial/chained-200/av-on", iters = 100, syscalls = false }
connect-serial-bad-missing-av-on       = { bench = "dashd-chainstate/connect_block_micro", id = "serial/bad-txns-inputs-missingorspent/av-on", iters = 50, syscalls = false }
connect-serial-bad-cb-amount-av-on     = { bench = "dashd-chainstate/connect_block_micro", id = "serial/bad-cb-amount/av-on", iters = 50, syscalls = false }
connect-par4-p2pkh-500-av-off          = { bench = "dashd-chainstate/connect_block_micro", id = "par4/p2pkh-500/av-off", iters = 1, syscalls = false, ungated = ["alloc_bytes", "page_faults"] }

# dashd-chainstate: CH3a's DisconnectBlock (`disconnect_block_micro`, CH3 §6.3, a5): one SerialCore::disconnect from
# the tip (DisconnectTip's call) of a connect_block_micro av-on block, which setup connects once and commits, into an
# overlay over the warm cache that is dropped uncommitted, so every iteration starts from the same state and has no
# setup of its own. The region includes the undo record's read (by path, on a fresh descriptor as Core's
# OpenUndoFile: openat, one statx, a pread64 of the record's size field and one of the record and its checksum,
# close), the checksum, the decode, every output's spend and compare and every input's ApplyTxInUndo; V's bracket
# (the EV attempt, the commit, the BLS scheme) is not in it. Setup is connect_block_micro's (the 640,000-entry
# synthetic index, ~4.4 G instructions a process), so instructions_total is mostly setup and stays gated. PF0 runs
# one of its six rows (DEC-297): p2pkh-500, per input and output (~2.4 M instructions an iteration, pinned at 100,
# ~240 M in the region). The other five are local and opt-in (`cargo bench -p dashd-chainstate --bench
# disconnect_block_micro -- serial/<row>`): empty (the fixed costs, ~45 k), chained-200 (200 transactions, each
# output restored and then spent again in reverse order, ~1.0 M), multisig-250 (p2pkh-500 but for the compressed
# script's type) and the 1 MB and 2 MB blocks (p2pkh-500's work 10 and 21 times over). The row has no strace pass,
# so the read's openat, statx and close are not gated; its two preads are, through /proc io's read syscalls and
# bytes. Every region counter is identical across processes (allocations and /proc io scale exactly with the
# iterations; page faults 0), so nothing is ungated. With it CH3a's twelve rows take about 11.0 min at D78's
# measured rate, an estimate (DEC-297).
disconnect-serial-p2pkh-500            = { bench = "dashd-chainstate/disconnect_block_micro", id = "serial/p2pkh-500", iters = 100, syscalls = false }

# dashd-chainstate: CH3b's reorg (`reorg`, CH3 §6.3, b2c): a reorg of depth 1, 6 and 30 through V, with the real
# connector, on a synthetic regtest chain (DIP0003, V20 and MN_RR moved out of reach, so the chain stays pre-DIP3). V
# is wired as dashd-node wires it (CoreConnector with NoEvo hooks and NodeHelper, -par=1, the block and undo files on
# disk, NullMempool), but with the coins in memory and never flushed, fixed salts, no listener and -checkblockindex
# off (regtest's default walks the whole index after every step and header). Every block from 102 on spends two
# OP_TRUE coins, the coinbase 100 below it and an output of its parent, so a branch's first block spends the two coins
# the block it replaces spent. Each iteration's setup mines a branch of d + 1 blocks from the tip's ancestor at depth
# d and hands V its headers and its first d blocks (requested, so stored at less work; the d-th ties the tip, which
# stays). The region is the last block's ProcessNewBlock: CheckBlock, AcceptBlock's write and the reorg its ABC runs,
# d DisconnectTips (the block and its undo record read from disk, DisconnectBlock, the commit) and d + 1 ConnectTips
# (d of them reading the block; ConnectBlock with its undo write and status writes, the commit); then
# SyncWithValidationInterfaceQueue, so the signals V staged have run. Per iteration 1.24 M, 6.57 M and 31.7 M
# instructions (412 k, 505 k and 519 k per block over its 2d + 1 steps), 65-76% of them X11: each of the 2d block
# reads hashes the header to check its proof of work, as Core's ReadBlockFromDisk does (~400 k), so the 0.5% floor is
# 1.4%, 1.9% and 2.1% of the rest. Syscalls 18, 83 and 397.4 an iteration: the files' openat, statx, pread64, pwrite64
# and close, and at depth 30 about 2.4 mprotects (glibc growing V's heap; they follow its layout, inside the floor).
# The chain grows a block an iteration, so iterations are pinned at the calibrated counts (124-158 M instructions in
# the region). Over 10 processes per build, syscalls repeat exactly and instructions spread by 0.01-0.07%. V parks on
# a select whose operations are an array on its stack (BL-453); a crossbeam Select allocated them after every reply,
# on either side of a region boundary as the scheduler put it, up to two 128-byte allocations a region. With nothing
# of V's left to race the boundaries, allocations and their bytes repeat exactly at every depth, and are the same in
# two builds that differed only in the setup, so they gate on every row. Page faults spread by 0-2 against a floor of
# one event: ungated on every row, as D131's par4 row's (peak RSS still gates memory). instructions_total (0.39-0.45 G,
# mostly the 140-block base chain and the setups' mining) gates. read_bytes
# repeats except in one process of 10 at depths 1 and 6, 6 bytes a span more: the shim's own /proc/self/io read counts
# in each span, and its text grows with the digits of the process's storage reads.
reorg-depth-1  = { bench = "dashd-chainstate/reorg", id = "reorg/depth-1", iters = 100, ungated = ["page_faults"] }
reorg-depth-6  = { bench = "dashd-chainstate/reorg", id = "reorg/depth-6", iters = 20, ungated = ["page_faults"] }
reorg-depth-30 = { bench = "dashd-chainstate/reorg", id = "reorg/depth-30", iters = 5, ungated = ["page_faults"] }

# dash-chain: the header index (SB4 §16) on a synthetic mainnet-shaped chain (H-M's length, mainnet
# genesis and parameters; see benches/support/fixture.rs). The lookup, locator, ancestor and tip lines load that
# 2.55M-entry index in setup, so their instructions_total (~17G against a region of 0.1-30M) and peak RSS (~1.2 GB)
# measure `load` and the arena's footprint, which stay gated on purpose; a change to `load` therefore shows in them
# and in the load line. The accept lines (A-25) hash and accept 2,000 real H-M headers (benches/data) on that chain
# cut at the window; chain-accept-headers is SB4's BG gate against Core's ProcessNewBlockHeaders on the same
# pre-state (dash-chain/tests/data/core-scenarios/bench-pnbh-mainnet-dgw.json.gz: 492,381,900 instructions; KGW's
# is 870,185,221).
chain-accept-headers    = { bench = "dash-chain/chain", id = "accept/mainnet-dgw-2000" }
chain-accept-kgw-2000   = { bench = "dash-chain/chain", id = "accept/mainnet-kgw-2000" }
chain-accept-spv-2000   = { bench = "dash-chain/chain", id = "accept/spv-anchored-w10000-2000" }
chain-index-lookup      = { bench = "dash-chain/chain", id = "lookup/hit-miss-10k" }
chain-locator-tip       = { bench = "dash-chain/chain", id = "locator/mainnet-tip" }
chain-ancestor-random   = { bench = "dash-chain/chain", id = "ancestor/mainnet-random-1k" }
chain-tip-step-publish  = { bench = "dash-chain/chain", id = "tip/connect-publish-1k" }
chain-load-records-256k = { bench = "dash-chain/chain", id = "load/records-256k" }
# dash-chain: the feeds (SB5 §11) on the same synthetic index, in benches/feeds.rs.
# - feed-publish, the BG gate line: 1,000 connect steps fanned out to 8 reader threads, which drain after the
#   last step (interleaved draining moves its instructions by ~20% with the scheduler on one CPU), plus
#   joining them. Its budget, 1,500 instructions per (step × subscriber) after subtracting
#   chain-tip-step-publish (the same steps, no subscriber), is checked by hand from the two lines; PF0 gates
#   each line against its own base.
# - feed-publish-full interleaves by construction (Q = 32): how many steps block, and so allocate a pending
#   segment, depends on the scheduler, so its instructions, allocations and page faults are ungated.
# - The contended variant (readers spin on intake) measures only spinning on one pinned CPU: no line until PF1.
# - The chain-cold-* lines read records below an SPV window through ChainReader::try_entry and the cold cache.
# - status-publish-coalesce: 1,000 status publications, each moving the best header down one block, with two
#   readers on the bench thread whose wakers fire on every one; each takes one coalesced report after the
#   last. status/publish-1k-0readers, unlisted, is the same publications with no reader.
# - chain-snapshot-cold-h: 1,000 heights below an SPV window through a 256-record cold cache, each an ancestor
#   walk down the skip links, about one MemHeaderStore read per height; chain-open-spv-w10000: SPV open at w = 10,000 over MemHeaderStore (SB13
#   measures SQLite). Both on a regtest chain the setup appends to the store under synthetic hashes (no X11),
#   about 45% of chain-open-spv-w10000's instructions_total at two iterations and in both lines' peak RSS.
#   SB5's D69 (open reads each cold skip target, 69 here) moved chain-open-spv-w10000 by +208,290 instructions
#   (+0.103%, 3 runs a side, spread 12k), +138 allocations and +97,152 alloc_bytes at two iterations.
# - chain-spv-typical-*: SB5 §6.3's typical rows (DEC-187), SPV's whole header step (accept, stage 3,
#   activate_segmented, the fanout to five draining subscribers) syncing 14,000 headers at w = 10,000 (desktop)
#   and 6,000 at w = 2,048 (mobile) in steps of 2,000. Peak RSS and page faults gate the residency A-F12 bounds
#   at 5.83 MB and 2.42 MB (DEC-187 amendment 3); allocations gate the step's allocation volume, MemHeaderStore's
#   included. The setup mines the headers once per process (X11, about 2 per header, deterministic) and checks one
#   sync; it is about 90% of instructions_total at two iterations, which stays gated like the other setup-heavy
#   lines. Peak RSS includes the store's tables and the mined headers (24.1 and 13.7 MiB locally).
feed-publish            = { bench = "dash-chain/feeds", id = "publish/connect-8sub-1k" }
feed-publish-full       = { bench = "dash-chain/feeds", id = "publish/cursor-retry-8sub-1k", ungated = ["instructions", "instructions_total", "instructions_process", "allocs", "alloc_bytes", "page_faults"] }
feed-reader-next        = { bench = "dash-chain/feeds", id = "reader/next-pop-compress-1k" }
feed-subscribe-at       = { bench = "dash-chain/feeds", id = "handoff/subscribe-at-64" }
status-publish-coalesce = { bench = "dash-chain/feeds", id = "status/publish-1k-2readers" }
chain-cold-lru          = { bench = "dash-chain/feeds", id = "cold/lru-hit-miss-90-10" }
chain-cold-lru-sweep    = { bench = "dash-chain/feeds", id = "cold/lru-miss-all-referenced" }
chain-snapshot-cold-h   = { bench = "dash-chain/feeds", id = "snapshot/at-height-cold-1k" }
chain-open-spv-w10000   = { bench = "dash-chain/feeds", id = "open/mem-w10000" }
chain-spv-typical-w10000 = { bench = "dash-chain/feeds", id = "spv/typical-w10000" }
chain-spv-typical-w2048  = { bench = "dash-chain/feeds", id = "spv/typical-w2048" }

# dash-dml: the masternode list (EV2 §6.5; PLAN EV2a BG), over 4,000 mainnet-shaped masternodes: clone plus
# 100 hot updates plus diff_to (crit:mnlist_clone_diff), 1,000 collateral probes of the unique map
# (crit:mnlist_unique_probe: the key is built inside the timed loop, so it includes its allocation;
# mnlist-unique-probe-prekeyed probes with the keys built once outside it, so only has_unique is
