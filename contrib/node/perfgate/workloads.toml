# dash-spv: header storage
# store: its syscall and write-syscall counts follow tokio's blocking pool, not the work: each extra pool
# thread the scheduler happens to start adds ~18 syscalls (clone3, rseq, sigaltstack, stack mmap/mprotect, ...)
# and eventfd wake-ups add writes (PF0 r2: 447-563 syscalls, 52-59 writes on unchanged code, the main false-FAIL
# source). They are reported, not gated; its filesystem syscalls (fs_syscalls: 225 on every run), instructions,
# allocations, I/O bytes, faults and RSS stay gated.
# durable: store's headers, then `stop()`: the whole cost of making them durable; store is its foreground share.
# warm: store's count of linked headers on a storage already holding as many, stopped. open: `DiskStorageManager::new`
# on a stopped storage holding store's headers. All three use tokio's blocking pool like store, so their syscall
# counts are reported, not gated.
# persist: one explicit `persist()` of the stored headers (segment writes, renames, fsyncs), set up unmeasured.
# Its file operations go through tokio's blocking pool too (PF0 r3: 1200-1255 syscalls on unchanged code;
# fs_syscalls 800 and write_syscalls 200 on every run), so its total syscall count is reported, not gated.
spv-storage-store     = { bench = "dash-spv/storage", id = "storage/disk/store", ungated = ["syscalls", "write_syscalls"] }
spv-storage-durable   = { bench = "dash-spv/storage", id = "storage/disk/store_durable", ungated = ["syscalls", "write_syscalls"] }
spv-storage-warm      = { bench = "dash-spv/storage", id = "storage/disk/store_warm", ungated = ["syscalls", "write_syscalls"] }
spv-storage-open      = { bench = "dash-spv/storage", id = "storage/disk/open", ungated = ["syscalls", "write_syscalls"] }
spv-storage-persist   = { bench = "dash-spv/storage", id = "storage/disk/persist", ungated = ["syscalls"] }
spv-storage-get       = { bench = "dash-spv/storage", id = "storage/disk/get" }
spv-storage-revindex  = { bench = "dash-spv/storage", id = "storage/disk/reverse_index" }
# dash-spv: headers into dash-consensus through `dash-spv::bridge` (SB12a), over Core's mainnet replies, each
# header hashed once, by dash-consensus (DEC-224, D17); the counter side of `spv-headers-*` for the path SB12 and
# SB14 move onto. bridge: the crossing alone, back: dash-spv's hashed headers taken from 2,000 dash-consensus
# headers (no X11). hash-bridge: 2,000 received headers into dash-consensus (one X11 each) and dash-spv's hashed
# headers taken from them. headers2: a full compressed reply decompressed into dash-consensus (one X11 per header)
# and dash-spv's hashed headers taken from it.
spv-headers-bridge-2000             = { bench = "dash-spv/headers", id = "headers/bridge/2000" }
spv-headers-hash-bridge-2000        = { bench = "dash-spv/headers", id = "headers/hash_and_bridge/2000" }
spv-headers2-decompress-bridge-8000 = { bench = "dash-spv/headers", id = "headers2/decompress_and_bridge/8000" }

