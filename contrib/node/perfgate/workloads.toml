bls-verify-large-agg-1000     = { bench = "dash-evo/bls_core", id = "bls_core/BLS_Verify_LargeAggregatedBlock1000" }
bls-pubkey-aggregate-normal   = { bench = "dash-evo/bls_core", id = "bls_core/BLS_PubKeyAggregate_Normal" }
