# EV1-J's row inventory (EV1-J plan rev4 §4 and §5.4; EV1 design §6.3 and D27, in
# docs/node-program/designs/EV1-specialtx.md), at Dash Core v24.0.0-rc.5.
#
# [[row]]: one certification row. `id` and `case` as §4 names them; `recipe`, how the probe is
# built (on regtest, with the chain `dashd-node/tests/ev1_j_dashd.rs` sets up); then one entry per
# path:
#   b    block via `submitblock`, check_sigs = true;
#   bav  block below assumevalid, check_sigs = false (plan §5.2);
#   m    mempool (`sendrawtransaction`, `testmempoolaccept`);
#   l2   the history replay (plan §4 "L2 replay").
# A path's value is the expected outcome on both nodes, `accept` or Core's reject reason, or the
# reason the path does not apply: `n/a: ...`, `excluded: ...` (a branch no consistent node
# reaches) or `infeasible: ...` (conditions that cannot hold together). A path with an outcome
# has `<path>_stage`, the EV1-J stage that runs it (J0a, J0b, J1, J2, J3; plan §3 and its J2
# delta). J3 holds deferrals only, `deferred: <where the evidence comes from>`, which no head
# runs and the test lists as skipped, never as passed. A row the test
# runs has `control` and `b_control`: the probe with the winning defect taken out, and the reject
# the next check gives, which shows the probe reaches its check with every earlier one passing. A
# row may also have `order_probe`/`b_order` and `order_control`/`b_order_control`: blocks with a
# second defect, placed so the stage Core's ConnectBlock answers from shows; D13-B and D13-B2 must
# have both (the test's STAGE_ROWS). A type 9 reject run at J0b-1 (and L2-C3.9, the test's
# POOL_ROWS) also needs its pool control: the
# valid unlock in the probe's place on the same template, whose CbTx does not count it, so Core's
# credit-pool check (run after the special-tx loop) answers `bad-cbtx-assetlocked-amount`; it is
# the row's `control`/`b_control` when the row has one defect, else
# `pool_control`/`b_pool_control`. A pair row's `b_control` is its loser's reject. Every run row
# pins `b_probes`, its number of block probes: each variant a row names (9-OK's payload versions,
# 9-R3's two recipes, 9-P5's versions 0 and 3) is its own probe with its own name, so a dropped
# variant fails. A row whose `bav` path runs pins `bav_probes` the same way and has two more
# controls (plan §5.2's assumevalid fixture, `dashd-node/tests/ev1_j/bav.rs`): `mode_control`/
# `bav_mode_control`, the row's probe without its defect and with one invalid script spend, which
# both nodes accept only below assumevalid (`fScriptChecks` false), and `twin`/`bav_twin`, the
# same block where its scripts are checked, which both reject with the script error. The test
# runs the rows file's J0b in sub-stages: J0b-1 every J0b block path but D14's, J0b-2 the BAV
# paths, J0b-3 D14; and J2 in J2-C (the L2-C block rows on the ChainLock fixture), J2-R2 (the
# rc.5 re-judging of the stored recordings, whose `l2_probes` pins the number of recordings) and
# J2-lib (L2-R1 and L2-R3, run by CH7a-5b's replay in dashd-node's lib tests; each names them in
# `l2_tests`, which the test checks against that source, since it cannot read their verdicts;
# `l2_probes` is the number of recordings they replay). The test pins the recorded exclusions
# (`excludes`, and the covers of a row no path of applies) to plan §4's (the test's EXCLUSIONS).
# Every block-path reject (`b`, `bav`, `b_control`, `b_order`, `b_order_control`,
# `b_pool_control`, `bav_twin`) has `<key>_class`: Core's BlockValidationResult for it, with the file:line that
# sets it at the tag. The test compares V's class to it; dashd's class is not observed (see the
# test's module docs).
# `covers` lists the §6.3 branches and pairs (EV1 design §6.3, §3.12) the row stands for: a step
# of ev1-pairs.toml's 7c or 9c table, a step with a §6.3 variant (`9c:11 expired`), or a pair
# `<winner>><loser>`; or one of D13's coins-view cases (`D13 ...`, plan §4 D13). `excludes` lists
# the cases a row records as unobservable on its paths, with the reason and the evidence kept in
# `notes`. `ev1_j_dashd`'s closure test first checks the rows against its own copy of §4's
# inventory (every row, path, stage and outcome, and each path's n/a reason), then that every
# branch, pair and D13 case is covered or recorded as excluded, and that each cover's reason is the
# row's reject.
#
# Restricted shape, as ev1-pairs.toml's (D29): `key = "string"` or `covers = [` / `excludes = [`
# with one string per line, so the test reads it with a line parser.

