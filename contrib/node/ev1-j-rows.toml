notes = "the covenant's block-view binding is unobservable on B (shadowed by FinishListForBlock; L0/L1 evidence `coins_views_d13`, dash-dml specialtx::tests): after V24 only a shared ProReg may create a template output, at its own collateral index (CheckSharedCollateralTemplateOutputs, specialtxman.cpp:1893-1909), so every same-block template output is a new masternode's collateral and the list build rejects its spend first, and a template output of an earlier block is in both views"
