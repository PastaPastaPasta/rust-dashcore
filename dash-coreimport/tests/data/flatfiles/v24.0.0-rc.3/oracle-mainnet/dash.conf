# Reference oracle (BS2). NOT for timing/benchmarks. See node-program/ORACLE.md
server=1
daemon=0
printtoconsole=0
disablewallet=1
txindex=1
addressindex=1
spentindex=1
timestampindex=1
blockfilterindex=1
coinstatsindex=1
dbcache=12000
maxmempool=300
par=0
upnp=0
natpmp=0
listenonion=0
logtimemicros=1
# P2P: outbound to the internet; inbound only from localhost (for future Rust-node <-> dashd tests)
listen=1
bind=127.0.0.1:27999
whitelist=noban,download@127.0.0.1
# RPC: localhost only, cookie auth
rpcbind=127.0.0.1:27998
rpcallowip=127.0.0.1
rpcport=27998
rpccookiefile=/work/chains/mainnet/rpc.cookie
rpcthreads=32
rpcworkqueue=1024
rpcservertimeout=120
zmqpubhashblock=tcp://127.0.0.1:27997
