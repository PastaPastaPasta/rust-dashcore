[package]
name = "dash-sha256"
description = "Dash Core's SHA-256: its SSE4, SSE4.1 4-way, AVX2 8-way, SHA-NI and ARMv8 SHA2 transforms with Core's runtime dispatch, plus the portable fallback."
authors.workspace = true
edition.workspace = true
# Ports Dash Core (MIT); the SSE4 transform is Intel's code (BSD-3-Clause). See LICENSE.
license = "MIT AND BSD-3-Clause"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
categories = ["cryptography"]
keywords = ["sha256", "dash", "hash", "simd"]

[lib]
name = "dash_sha256"
path = "src/lib.rs"

[dependencies]

[dev-dependencies]
proptest = "1.11"
serde_json = "1.0"
criterion = "0.5"

[[bench]]
name = "sha256"
harness = false
