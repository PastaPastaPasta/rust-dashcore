[package]
name = "dash-kv-sqlite"
description = "The SPV store's storage engine: dash-kv's KvEngine contract on SQLite"
publish = false
license = "MIT"
authors.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dash-kv = { path = "../dash-kv" }
# Exact pins, in lockstep with Platform's (SB0 §9.3 (f)), except that an advisory fixed only in a
# newer rusqlite moves the fork first (DEC-1468). Now rusqlite 0.41 and libsqlite3-sys 0.39 for
# the bundled SQLite 3.54 fix (RUSTSEC-2026-0459), ahead of Platform's 0.38 / 0.36 until its bump
# merges. libsqlite3-sys is named only for its pin.
libsqlite3-sys = { version = "=0.39.1", default-features = false }
# SQLite is built from source on every target, iOS included (SB0 §9.3 (f), DEC-1472).
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[dev-dependencies]
# The engine contract suite (`dash_kv::contract`), and the SPV store's workload and checks
# (`dash_kv::faulty::spv`, run under recorded images); they add modules, and no hook to engine code.
dash-kv = { path = "../dash-kv", features = ["model", "faulty"] }
tempfile = "3"
