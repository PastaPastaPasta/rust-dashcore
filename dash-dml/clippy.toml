# Clippy reads the nearest clippy.toml and does not merge it with the root one,
# so this repeats the root's contents (msrv and the Block::merkle ban) and the
# determinism bans of contrib/node/pure-clippy.toml, and adds dash-consensus's
# encoder and floating-point bans, which hold here too (A1 §1.3, §2.1).
# contrib/node/check-pure.sh merges the root file, pure-clippy.toml and this
# file, and makes all of them forbid-level.
msrv = "1.89"

# Determinism (A1 §2.1): consensus code uses BTreeMap/BTreeSet or a sorted Vec.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "iteration order is not deterministic; consensus code uses BTreeMap or a sorted Vec (A1 §2.1)" },
    { path = "std::collections::HashSet", reason = "iteration order is not deterministic; consensus code uses BTreeSet or a sorted Vec (A1 §2.1)" },
]

# The sole consensus encoder (A1 §1.3): bytes come from core_serialize and hashes
# from the Tx/Header/Block wrappers, never from base-sdk's encoders.
#
# No libm (CS2 §2.2): floating point exists only in dash_consensus::fp, and
# dash-dml has none.
# Core's consensus floating point calls libm's pow twice: the subsidy's pow(x, 2.0), which every release build
# compiles to one multiplication, and KGW's pow(m / 28.2, -1.228), which `fp`
# replaces with a table of correctly rounded values. So the port needs only IEEE
# + - * / and comparisons, which are bit-exact on every target; a libm result
# depends on the platform's libm, and a fused multiply-add rounds once where
# Core's x86_64 build rounds twice.
disallowed-methods = [
    { path = "dash_primitives::Block::merkle", reason = "consensus hashes come from dash-consensus (Block::merkle(rules)), not base-sdk's encoder (A1 §1.3)" },
    { path = "dash_types::codec::BaseCodec::encode", reason = "consensus bytes come from core_serialize (A1 §1.3)" },
    { path = "dash_types::Hashable::hash", reason = "consensus hashes come from the Tx/Header/Block wrappers (A1 §1.3)" },
    { path = "std::env::var", reason = "consensus code does not read the environment" },
    { path = "std::env::var_os", reason = "consensus code does not read the environment" },
    { path = "dash_num::Arith256::to_f64", reason = "floats stay in fp; Core's difficulty is ConvertBitsToDouble of the raw nBits (CS2 §2.2, §2.6)" },
    { path = "f64::powf", reason = "libm (CS2 §2.2)" },
    { path = "f64::powi", reason = "libm (CS2 §2.2)" },
    { path = "f64::exp", reason = "libm (CS2 §2.2)" },
    { path = "f64::exp2", reason = "libm (CS2 §2.2)" },
    { path = "f64::exp_m1", reason = "libm (CS2 §2.2)" },
    { path = "f64::ln", reason = "libm (CS2 §2.2)" },
    { path = "f64::log", reason = "libm (CS2 §2.2)" },
    { path = "f64::log2", reason = "libm (CS2 §2.2)" },
    { path = "f64::log10", reason = "libm (CS2 §2.2)" },
    { path = "f64::ln_1p", reason = "libm (CS2 §2.2)" },
    { path = "f64::sqrt", reason = "libm (CS2 §2.2)" },
    { path = "f64::cbrt", reason = "libm (CS2 §2.2)" },
    { path = "f64::mul_add", reason = "fused multiply-add rounds differently from Core's x86_64 build (CS2 §2.2)" },
    { path = "f64::hypot", reason = "libm (CS2 §2.2)" },
    { path = "f64::sin", reason = "libm (CS2 §2.2)" },
    { path = "f64::cos", reason = "libm (CS2 §2.2)" },
    { path = "f64::tan", reason = "libm (CS2 §2.2)" },
    { path = "f32::powf", reason = "libm (CS2 §2.2)" },
    { path = "f32::powi", reason = "libm (CS2 §2.2)" },
    { path = "f32::exp", reason = "libm (CS2 §2.2)" },
    { path = "f32::exp2", reason = "libm (CS2 §2.2)" },
    { path = "f32::exp_m1", reason = "libm (CS2 §2.2)" },
    { path = "f32::ln", reason = "libm (CS2 §2.2)" },
    { path = "f32::log", reason = "libm (CS2 §2.2)" },
    { path = "f32::log2", reason = "libm (CS2 §2.2)" },
    { path = "f32::log10", reason = "libm (CS2 §2.2)" },
    { path = "f32::ln_1p", reason = "libm (CS2 §2.2)" },
    { path = "f32::sqrt", reason = "libm (CS2 §2.2)" },
    { path = "f32::cbrt", reason = "libm (CS2 §2.2)" },
    { path = "f32::mul_add", reason = "fused multiply-add (CS2 §2.2)" },
    { path = "f32::hypot", reason = "libm (CS2 §2.2)" },
    { path = "f32::sin", reason = "libm (CS2 §2.2)" },
    { path = "f32::cos", reason = "libm (CS2 §2.2)" },
    { path = "f32::tan", reason = "libm (CS2 §2.2)" },
]
