[package]
name = "dash-network"
description = "The `Network` enum and its pure helpers (magic bytes, activation heights, default P2P ports) extracted from `dashcore` into a lightweight crate so that lightweight consumers can depend on it without pulling in the full protocol library."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
name = "dash_network"
path = "src/lib.rs"

[features]
default = []
# serde::{Serialize, Deserialize} impls for Network.
serde = ["dep:serde"]
# bincode::{Encode, Decode} impls for Network.
bincode = ["dep:bincode", "dep:bincode_derive"]
# C-ABI `FFINetwork` mirror + `dashcore_network_get_name` extern fn.
ffi = []
# `From` conversions to and from `dash_params::Network` (BS16). They need the
# node's base-sdk fork, whose `Network` has `Devnet` and `ALL`.
params = []

[dependencies]
dash-params = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
bincode = { workspace = true, optional = true }
bincode_derive = { workspace = true, optional = true }

# base-sdk's `dash-pow`, reached through `dash-params`, needs `portable` on targets without
# the CPU features its accelerated X11 requires; enabling it here, as dashcore_hashes does,
# keeps this crate building on its own.
[target.'cfg(all(target_arch = "aarch64", not(all(target_feature = "neon", target_feature = "aes"))))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[target.'cfg(all(target_arch = "wasm32", not(target_feature = "simd128")))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[target.'cfg(not(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "wasm32")))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[dev-dependencies]
# Turns the optional impls on for this crate's own tests, so `cargo test --workspace` runs
# them. It also means no test build has the features off. This dev-dependency is dropped on
# publish, but `dash-params` is a git dependency, which `cargo package` refuses.
dash-network = { path = ".", features = ["bincode", "ffi", "params", "serde"] }
serde_json = "1.0"
test-case = "3.3"

[build-dependencies]
cbindgen = "0.29"
