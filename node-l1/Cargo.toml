[package]
name = "node-l1"
description = "L1 differential comparisons of the node's consensus code against Dash Core's in-process oracle (A1 §4.4): one comparison per target, shared by the libFuzzer targets, their proptest twins, the boundary rows and the private-seed replay. Test-only; never a runtime dependency."
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
name = "node_l1"
path = "src/lib.rs"

[features]
# Link Dash Core's oracle (dash-oracle-sys). Without it the crate is empty and its tests are
# skipped, as for dash-oracle-sys. It also turns on dashd-chainstate's `model` (its
# `RefCoinsCache` twin of Core's views, CH2c) and dashd-masternode's `core-layout` (Core's flat-file
# magic messages, BL-451), so a workspace build does not (CH2 §6.7's guard; SP1 D3).
oracle = ["dash-oracle-sys/oracle", "dashd-chainstate/model", "dashd-masternode/core-layout"]
# `diff_chain`'s rdashd side (O2b-3b): dashd-node's `NodeSut`, behind its `test-support` (never
# in a product build: O2b §6.4). Optional, so a workspace build does not turn it on.
sut = [
    "oracle",
    "dep:dash-args",
    "dep:dash-chain",
    "dep:dashd-node",
    "dashd-node/test-support",
]
# L3 (CH3a a10): the mutation harness against a real dashd v24 (`l3_dashd`, `dash-conformance
# l3`). Test-only, as `sut`.
l3 = ["sut", "dep:node-test-ports"]

[dependencies]
bitcoin_hashes = { version = "1.2.0", default-features = false, features = ["std"] }
# `diff_bls_decode` builds its point classes with blst (dash-pkc's release).
blst = { version = "0.3.17", default-features = false }
# O2a-CJ1's CoinJoin rules (`diff_coinjoin`).
dash-coinjoin = { path = "../dash-coinjoin" }
dash-args = { path = "../dash-args", optional = true }
# V's header batches and index reads for `diff_chain`'s rdashd side (`sut`).
dash-chain = { path = "../dash-chain", optional = true }
dash-consensus = { path = "../dash-consensus" }
# GV1a's governance rules (`diff_gov`, `diff_gov_vote`), over O2a-GOV's regtest fixture: node 0's
# `governance.dat` read by dash-coreimport, the harness's voting keys signed with secp256k1.
dash-coreimport = { path = "../dash-coreimport" }
dash-governance = { path = "../dash-governance" }
dash-network = { path = "../dash-network" }
secp256k1 = { workspace = true, features = ["recovery"] }
# EV2a's masternode list (`dml`), with its test builders and EV2b's block replay, which runs the
# reference twin (`xcheck`) beside every build.
dash-dml = { path = "../dash-dml", features = ["test-utils"] }
# EV2b's member source and effect sink (`dml_apply`); LQ1a's member selection, with the
# models of Core's LLMQ caches it is compared through.
dash-evo = { path = "../dash-evo", features = ["reference"] }
# The CS3 input formats (`check_inputs`, shared with dash-consensus's tests) build chain
# parameters and headers.
dash-num = { workspace = true, features = ["std"] }
dash-oracle-sys = { path = "../dash-oracle-sys" }
dash-params = { workspace = true, features = ["std"] }
# BS8's overlay messages (O2c), with the node's BLS rules (`dash-pkc`'s eager BLS).
dash-p2p-core = { workspace = true, features = ["std"] }
# `diff_p2p_multi_*`'s node leg (P2a-core): the processor in its `sim` harness.
dash-p2p = { path = "../dash-p2p" }
dash-p2p-transport = { path = "../dash-p2p-transport" }
# The address relay the session node leg installs (P2a-net D24).
dashd-net = { path = "../dashd-net" }
dashd-p2p = { path = "../dashd-p2p", features = ["sim"] }
tracing = "0.1"
dash-pkc = { workspace = true, features = ["std", "bls"] }
dash-primitives = { workspace = true, features = ["std"] }
# `diff_chain` (O2b-3): the steps' StateDigest records and the comparator's planes.
dash-statedigest = { path = "../dash-statedigest" }
serde_json = "1.0"
dash-types = { workspace = true, features = ["codec", "std"] }
# CH2's coins cache and block overlay, compared against Core's coins views (O2a-CO), over the
# in-memory engine (and, under `oracle`, its `model` twin of Core's views).
dashd-chainstate = { path = "../dashd-chainstate" }
dashd-node = { path = "../dashd-node", optional = true }
# L3's dashd ports (`l3`).
node-test-ports = { path = "../node-test-ports", optional = true }
# SP1's masternode sync, fulfilled requests and meta cache (`mnsync`, BL-451), with the mock clock
# their times come from and the netfulfilled key.
dashd-masternode = { path = "../dashd-masternode", default-features = false }
dash-clock = { path = "../dash-clock" }
dash-netaddr = { path = "../dash-netaddr" }
# `mnsync`'s netfulfilled reload goes through the manager's own file.
tempfile = "3"
dashd-store = { path = "../dashd-store", default-features = false }
# `diff_dml_apply` reads O2a-EV's crafted fixture (with serde_json above).
serde = { workspace = true, features = ["derive", "std"] }
# `diff_block_value_payee` reads O2a-GV's gzipped payments fixture.
flate2 = "1"

[dev-dependencies]
dash-core-vectors = { path = "../test-vectors" }
# Core's blk files for `quorum_root_history` (LQ2 D15).
dash-coreimport = { path = "../dash-coreimport" }
# CS6's caches and check queue (`l1_sigcache`), and the harness keys its spends are signed with.
dashd-chainstate = { path = "../dashd-chainstate" }
dash-pkc = { workspace = true, features = ["bls"] }
node-sink = { path = "../node-sink" }
proptest = "1.7"
secp256k1 = { workspace = true }
tempfile = "3"
serde = { workspace = true, features = ["derive", "std"] }

