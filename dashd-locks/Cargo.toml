[package]
name = "dashd-locks"
description = "ChainLock intake, coinbase extraction and InstantSend lock state for the Rust Dash node."
publish = false
license = "MIT"
authors.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
oracle = ["dash-oracle-sys/oracle"]
test-support = []

[dependencies]
dash-clock = { path = "../dash-clock" }
dash-consensus = { path = "../dash-consensus" }
dash-evo = { path = "../dash-evo" }
dash-kv = { path = "../dash-kv" }
dash-num = { workspace = true, features = ["std"] }
dash-params = { workspace = true, features = ["std"] }
dash-p2p-core = { workspace = true, features = ["std"] }
dash-pkc = { workspace = true, features = ["bls", "std"] }
dash-primitives = { workspace = true, features = ["std"] }
dash-statedigest = { path = "../dash-statedigest" }
dash-types = { workspace = true, features = ["codec", "std"] }
dashd-chainstate = { path = "../dashd-chainstate", features = ["statedigest"] }
dashd-p2p = { path = "../dashd-p2p" }
dashd-store = { path = "../dashd-store" }
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
dash-chain = { path = "../dash-chain" }
dash-core-vectors = { path = "../test-vectors" }
dash-kv = { path = "../dash-kv", features = ["faulty"] }
dash-oracle-sys = { path = "../dash-oracle-sys" }
dashd-chainstate = { path = "../dashd-chainstate", features = ["statedigest", "test-support"] }
proptest = "1"
serde = { workspace = true, features = ["derive", "std"] }
serde_json = "1.0"
tempfile = "3"
zstd = "0.14"

[[test]]
name = "handler_oracle"
required-features = ["oracle"]

[package.metadata.gate]
test-features = ["test-support"]
