[package]
name = "dash-chainparams"
description = "The node's chain parameters (Core's CChainParams): base-sdk's stateless dash-params, re-exported, with the node-side devnet, chain setup, Core option builder, spork signers and runtime policy on top (POL-3, DEC-1042)."
authors.workspace = true
edition.workspace = true
license = "MIT"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
name = "dash_chainparams"
path = "src/lib.rs"

[features]
default = []
std = [
    "bsdk-params/std",
    "base58ck/std",
    "bitcoin_hashes/std",
    "bitcoin-units/std",
    "dash-num/std",
    "dash-types/std",
]
full = ["bsdk-params/full", "std"]
# `tests/fork_equivalence.rs`: builds every case through the base-sdk fork's own builder too,
# which only the fork's `dash-params` has, so it is off where base-sdk resolves upstream.
fork-equivalence = []

[dependencies]
# base-sdk's `dash-params` under another name, so that consumers can keep the path name
# `dash_params` for this crate (DEC-1043).
bsdk-params = { workspace = true }
base58ck = { workspace = true, features = ["alloc"] }
bitcoin_hashes = { workspace = true, features = ["alloc"] }
bitcoin-units = { workspace = true, features = ["alloc"] }
dash-num = { workspace = true }
dash-types = { workspace = true }
dash-x11 = { path = "../dash-x11" }
hex-conservative = { workspace = true }

# base-sdk's `dash-pow`, reached through `dash-params`, needs `portable` on targets without
# the CPU features its accelerated X11 requires; enabling it here, as dash-network does,
# keeps this crate building on its own.
[target.'cfg(all(target_arch = "aarch64", not(all(target_feature = "neon", target_feature = "aes"))))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[target.'cfg(all(target_arch = "x86_64", not(all(target_feature = "aes", target_feature = "avx", target_feature = "avx2", target_feature = "bmi1", target_feature = "bmi2", target_feature = "f16c", target_feature = "fma", target_feature = "lzcnt", target_feature = "movbe", target_feature = "xsave"))))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[target.'cfg(all(target_arch = "wasm32", not(target_feature = "simd128")))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

[target.'cfg(not(any(target_arch = "aarch64", target_arch = "x86_64", target_arch = "wasm32")))'.dependencies]
dash-pow = { workspace = true, features = ["portable"] }

# The tests read the corpora with `serde_json` and name the types the builder's values hold.
# Features are set here, so that the crate's tests build on their own with default features.
[dev-dependencies]
bitcoin-units = { workspace = true, features = ["std"] }
dash-num = { workspace = true, features = ["std"] }
dash-script = { workspace = true, features = ["codec", "std"] }
dash-types = { workspace = true, features = ["codec", "std"] }
hex-conservative = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, features = ["std"] }
test-case = { workspace = true }

[[test]]
name = "fork_equivalence"
required-features = ["fork-equivalence"]
