[package]
name = "dash-oracle-sys"
description = "In-process Dash Core consensus oracle (libdash_oracle) for differential tests and fuzzing. Test-only; never a runtime dependency."
authors.workspace = true
edition.workspace = true
# The linked archive is Dash Core code (MIT); see DEC-07.
license = "MIT"
repository.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false
links = "dash_oracle"

[features]
# Link libdash_oracle for every pin in pins.txt, built by contrib/node/build-oracle.sh
# (or by build.rs itself with DASH_ORACLE_AUTOBUILD=1).
oracle = ["dep:dash-statedigest", "dep:serde", "dep:serde_json"]

[dependencies]
# chain sessions' reports (src/chain.rs)
dash-statedigest = { path = "../dash-statedigest", optional = true }
serde = { workspace = true, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0", optional = true }

[build-dependencies]
# sha256 of the cached archives (build/archive.rs)
bitcoin_hashes = { workspace = true, features = ["std"] }

[dev-dependencies]
bitcoin_hashes = { workspace = true, features = ["std"] }
dash-core-vectors = { path = "../test-vectors" }
# gov_regtest.rs reads node 0's governance.dat with the IM1b reader.
dash-coreimport = { path = "../dash-coreimport" }
dash-network = { path = "../dash-network" }
dash-pkc = { workspace = true, features = ["bls", "std"] }
dashcore = { path = "../dash" }
flate2 = "1"
secp256k1 = { workspace = true, features = ["recovery"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"

