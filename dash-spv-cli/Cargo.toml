[package]
name = "dash-spv-cli"
description = "Command-line tools for the Dash SPV client: the dash-spv binary and the dash-spv-ffi smoke-test binary"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
dash-spv = { path = "../dash-spv", features = ["log-file", "env-filter"] }
dash-spv-ffi = { path = "../dash-spv-ffi", features = ["log-file"] }
dashcore = { path = "../dash" }
dash-network = { path = "../dash-network", features = ["ffi"] }
key-wallet = { path = "../key-wallet" }
key-wallet-ffi = { path = "../key-wallet-ffi" }
key-wallet-manager = { path = "../key-wallet-manager" }

clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing = "0.1"
hex-conservative = { workspace = true }

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "dash-spv"
path = "src/bin/dash_spv.rs"
# Same crate name as the dash_spv library: keep the two out of each other's rustdoc.
doc = false

[[bin]]
name = "dash-spv-ffi"
path = "src/bin/dash_spv_ffi.rs"
doc = false
