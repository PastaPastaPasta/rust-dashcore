# The quirk register (FR-CON-34; A1 §4.1 principle 5; PLAN task O5).
#
# Dash Core behaviour the node replicates bug for bug. R4 §1.15 lists 1–34, A1 rev1 §1.4.1 adds
# 35–38, and later designs registered 39 (DEC-25(4)), 40 (DEC-29 D2), 41 and 42 (DEC-50(4)).
# Quirks found later are appended with the next free id. The P2P quirks PQ-1…23 (DEC-48 Q4) are
# a separate block in the P2a design, not numbered here.
#
# Each entry:
#   id      the quirk number
#   title   one neutral line
#   core    where the behaviour lives in Dash Core v24.0 (tag v24.0.0-rc.3, DEC-82), file:line
#   owner   the PLAN §4 task that implements the quirk and un-ignores its test
#   also    other tasks whose PLAN rows or designs name the quirk (rule sites, consumers); optional
#   evidence  real-chain or other observations about the quirk (optional; one line per item,
#           list of strings)
#
# Where several PLAN rows list a quirk, the owner is the task that implements the rule itself in
# a pure crate (e.g. CS2 for 15, which has its test; EV3 for 31, whose rule is MNHF validation);
# the integrating task (CH7a) and the rule-site tasks are `also`.
#   status  "tested"            the test runs and asserts Core's behaviour on Core's vectors; for a
#                               registered deviation (its title says so), the node's behaviour
#           "scaffold"          the test is `#[ignore = "quirk N: owner TASK"]` until the owner lands it
#           "dropped (DEC-82)"  the behaviour is v23.1-only; no test
#   test    `<path>::<fn>` of the quirk's one test, named `quirk_NN_<slug>` (absent when dropped);
#           `base-sdk:<path>::<fn>` for a test in the base SDK fork, read at the pinned revision
#           (`contrib/node/base_sdk_pins.py show`)
#   source  where the quirk was registered
#
# contrib/node/check-quirks.py checks that this file and the tests agree and prints the counts
# STATUS tracks. The owner of a quirk that lands moves its test next to the implementation if it
# lives elsewhere, removes the `#[ignore]`, and sets status = "tested" here in the same commit.

