# Generated by `python3 contrib/node/check-layers.py params --write` (BS5-R §2g, P3 (a)): the
# root clippy.toml with contrib/node/node-params-bans.toml's entries added to its
# disallowed-methods, as clippy reads only the nearest clippy.toml. Do not edit it: change those
# files and run that command.
msrv = "1.89"

# The sole consensus encoder (node program, A1 §1.3): consensus hashes come from
# dash-consensus's wrappers, never from base-sdk's encoders. base-sdk's inherent
# merkle helper hashes its leaves through base-sdk's own encoder. Crates that do
# not depend on base-sdk ignore this entry. A crate with its own clippy.toml
# repeats this file's contents, since clippy reads only the nearest one.
disallowed-methods = [
    { path = "dash_primitives::Block::merkle", reason = "consensus hashes come from dash-consensus (Block::merkle(rules)), not base-sdk's encoder (A1 §1.3)" },
    # bip39's `word_list` is `#[inline]` over a `const`: each codegen unit that calls it links its own
    # copy of the word lists (~0.8 MiB of relocations). key-wallet borrows bip39's via `bip39_word_list`.
    { path = "bip39::Language::word_list", reason = "links another copy of the word lists; see key-wallet mnemonic::bip39_word_list" },
    { path = "bip39::Language::find_word", reason = "inlines word_list, which links another copy of the word lists; see key-wallet mnemonic::bip39_word_list" },
    { path = "bip39::Mnemonic::words", reason = "inlines word_list, which links another copy of the word lists; see key-wallet mnemonic::bip39_word_list" },
    # dash-params' static tables (BS5-R §2g; contrib/node/node-params-bans.toml).
    { path = "dash_params::ConsensusParams::llmq", reason = "reads #83's static table; use `ChainSetup` (sees `-llmqtest*params`, `-llmqdevnetparams`, devnet names; DEC-903)" },
    { path = "dash_params::LlmqType::params", reason = "reads #83's static table; use `ChainSetup` (sees `-llmqtest*params`, `-llmqdevnetparams`, devnet names; DEC-903)" },
    { path = "dash_params::Network::chain", reason = "reads #83's static table; use `ChainSetup` (sees `-llmqtest*params`, `-llmqdevnetparams`, devnet names; DEC-903)" },
    { path = "dash_params::Network::consensus", reason = "reads #83's static table; use `ChainSetup` (sees `-llmqtest*params`, `-llmqdevnetparams`, devnet names; DEC-903)" },
    { path = "dash_params::Network::addr", reason = "reads #83's static address parameters, whose `bech32_hrp` is wrong at V23_1; use `ChainSetup`'s `addr_params` and `platform_hrp`" },
]
