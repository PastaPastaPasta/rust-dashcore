[package]
name = "dashcore_hashes"
description = "Hash functions used by the rust-dash eccosystem"
authors = ["Samuel Westrich <sam@dash.org>"]
edition = "2021"
categories = ["algorithms"]
keywords = [ "crypto", "dash", "hash", "digest" ]
readme = "README.md"
exclude = ["tests", "contrib"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = []
serde = ["dep:serde", "bitcoin_hashes/serde"]
serde-std = ["serde", "serde/std"]
# `hash_x11`, computed by `dash-x11`, the pure Rust port of Core's code (the default backend).
x11 = ["dep:dash-x11"]
# `hash_x11` computed by the C `rs-x11-hash` instead, for 80-byte headers (the library cannot hash
# other lengths; `dash-x11` still does). The choice is made for the whole build, as features are:
# any crate asking for it switches every user of `hash_x11`.
x11-c = ["x11", "dep:rs-x11-hash"]
# Internal, test-only (the leading `__`): `hash_x11::x11_calls`, a per-thread count of X11
# computations, so a consumer's tests can show a header is hashed once (dash-spv's bridge,
# SB12a). It compiles only with debug assertions, so a release build emits nothing for it even
# with every feature on.
__x11-count = ["x11"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bincode = { workspace = true, optional = true }
bitcoin_hashes = { workspace = true, features = ["std"] }
# The version is the workspace's; move it with the rest at a release (contrib/release.sh publishes this crate).
dash-x11 = { path = "../dash-x11", version = "0.45", optional = true }
hex-conservative = { workspace = true }
rs-x11-hash = { version = "0.1.8", optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_test = "1.0"
criterion = "0.5"
test-case = "3.3"

[target.wasm32-unknown-unknown.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "hashes"
harness = false

[[bench]]
name = "siphash"
harness = false

[[bench]]
name = "x11"
harness = false
required-features = ["x11"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(bench)', 'cfg(fuzzing)'] }
