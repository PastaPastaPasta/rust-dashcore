name: Sanitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
  pull_request:
    paths:
      - 'key-wallet-ffi/**'
      - 'dash-spv-ffi/**'
      - 'dash/**'
      - 'hashes/**'
      - 'crypto/**'
      - 'internals/**'
      - 'dash-network/**'
      - 'key-wallet/**'
      - 'key-wallet-manager/**'
      - 'dash-spv/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sanitizer.yml'
      - 'Justfile'
      - 'mod.just'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the Cargo jobs while base-sdk comes from the local fork (ci-plan.yml).
  plan:
    name: CI plan
    uses: ./.github/workflows/ci-plan.yml

  asan:
    name: Address Sanitizer
    needs: plan
    if: needs.plan.outputs.hosted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just

      - name: Run tests with ASAN
        run: just asan

  tsan:
    name: Thread Sanitizer
    needs: plan
    if: needs.plan.outputs.hosted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src --no-self-update

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: just

      - name: Run tests with TSAN
        run: just tsan
