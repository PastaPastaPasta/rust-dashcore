# O2b-3a: chain sessions driven by generated op sequences (node-program O2b §3-§6). Core alone
# until O2b-3b (CoreOnly: shim health, the generator's expectations, same-process replay);
# never certified in this mode. Not farmed until O2b-4 measures its floors (nightly 0).
# Schedule S0 (S1 is O2b-4's diff_chain_par). The census goes to the run's tmp/diff_chain.stats.json.
# A pure replay of its corpus drifts by up to 2 cov per 21 CPU-min and its ft by 0.22-1.0 % an hour
# (BL-222): the plateau tests take 6 cov per window as flat and leave ft out (DEC-260 (2), (4)).
# Its corpus loads differently in different processes. 8 replays of one 1626-input corpus
# (regress/bl222-corpus, in libFuzzer's own order, as certify replays it) spread by 9 cov and 65 ft
# (0.073 %) on the T17 pin (Core 7188798eff), and by 15 cov (17558-17573) and 101 ft (0.1135 %) on
# the T19 pin (77dbec8242). The worst figure on either pin is kept (DEC-277): certify's two replays
# may differ by ceil(1.5 x 15) = 23 cov and ceil(1.5 x 101) = 152 ft (DEC-271; README, certify).
# DEC-271's 18-20 cov came from fixed-order replays of the D36 seed sets twice over (AABBCC vs
# ABCABC, DEC-260 (1)), not from a corpus loaded the way certify loads one. Measure again as the
# corpus grows and on every oracle pin change.
[[target]]
name = "diff_chain"
owner = "node-l1"
kind = "l1"
pins = ["v24.0"]
route = "private"
smoke = 60
