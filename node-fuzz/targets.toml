# Every node-fuzz target (O3). run.sh refuses a target that is not listed here, and
# `fuzzctl check` fails unless this file, Cargo.toml's [[bin]] entries, the target files,
# node_l1::TARGETS and node_fuzz::models::MODELS agree.
#
# owner         the crate whose code the target checks
# kind          l1: a node-l1 comparison against Dash Core's oracle (CS0 §9.3)
#               model: a check against a reference model (DEC-59 Q1)
#               selftest: the runner's self-test target (run by `run.sh --selftest` only)
# pins          the target's legs: one per pin (v24.0 only, DEC-82)
# route         where triage puts minimised regression vectors (PLAN §7.5):
#               private: stays in $DASH_EMBARGO_DIR; summaries give counts only. The default,
#                        and required for every tx/block-codec target.
#               public:  `fuzzctl export-public` may copy them out for git; STATUS lines name
#                        the target and class
# smoke         CPU seconds per leg in the per-PR smoke (0: none)
# nightly       the target's weight in the nightly farm, per leg (0: not farmed)
# public_seeds  repository directories whose files run.sh copies into the private public-seeds/
# honggfuzz     the honggfuzz twin of the target in the workspace fuzz/ crate, if it has one.
#               fuzzctl check fails on a fuzz/fuzz_targets/ file of a node crate (any directory
#               but upstream's dash/ and hashes/) that no entry names.
# min_certify_execs  executions a `fuzzctl certify` window needs before it can certify (DEC-186;
#               default 1000000; fewer is `insufficient-progress`); set it for a slow target
# smoke_corpus_max, smoke_corpus_max_bytes  the files and bytes of the smoke's sample of the
#               working corpus and public seeds (BL-333; default 64 files, 4 MiB); the private
#               seeds and fixed vectors are loaded in full whatever they say. Set from a
#               measurement: the leg's INITED within half its smoke budget at the 90th
#               percentile of its measured CPU-s per execution.

[[target]]
name = "diff_tx_decode"
owner = "dash-consensus"
kind = "l1"
pins = ["v24.0"]
route = "private"
smoke = 60
nightly = 4

[[target]]
name = "diff_block_decode"
owner = "dash-consensus"
kind = "l1"
pins = ["v24.0"]
route = "private"
smoke = 60
nightly = 4
public_seeds = ["test-vectors/core/0364ed626ec2/src/bench/data"]

