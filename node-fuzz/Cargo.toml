[package]
name = "node-fuzz"
description = "libFuzzer targets of the node program: L1 differential comparisons (A1 §4.4; CS0 §9.3) and model targets (DEC-59 Q1). Run only through run.sh."
version = "0.0.0"
edition = "2024"
license = "CC0-1.0"
publish = false

# A workspace of its own, so `cargo test --workspace` never links the oracle archives. It
# repeats the root's base-sdk [patch] table, which run.sh checks before every build.
[workspace]

[lib]
name = "node_fuzz"
path = "src/lib.rs"

[features]
# The runner's self-test target (a comparison that always diverges on one input).
selftest = []

[dependencies]
bitcoin_hashes = { version = "0.14.101", default-features = false, features = ["std"] }
# The coin codec `packed_coin_roundtrip` checks the coins cache's value against (CS5a).
dash-consensus = { path = "../dash-consensus" }
dash-coreimport = { path = "../dash-coreimport" }
# `dml_codec_roundtrip`: the DML codecs; `netinfo_*`: EV1's NetInfo rules.
dash-dml = { path = "../dash-dml" }
dash-network = { path = "../dash-network" }
dash-oracle-sys = { path = "../dash-oracle-sys", features = ["oracle"] }
# SB6: the decode policy and the gates the p2p models check.
dash-p2p = { path = "../dash-p2p" }
dash-p2p-core = { git = "https://github.com/dashpay/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", default-features = false, features = ["std"] }
# test-peer: the scripted peer sets the reserved header bits.
dash-p2p-transport = { path = "../dash-p2p-transport", features = ["test-peer"] }
# `netinfo_*`: every network's parameters and the NetInfo wire types (EV1).
dash-params = { git = "https://github.com/dashpay/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", default-features = false, features = ["std"] }
dash-primitives = { git = "https://github.com/dashpay/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", default-features = false, features = ["std"] }
dash-pkc = { git = "https://github.com/dashpay/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", default-features = false }
dash-sha256 = { path = "../dash-sha256" }
dash-types = { git = "https://github.com/dashpay/base-sdk", rev = "33fcc59e1868c803f9608e0e78ee8bddf3abcee7", default-features = false, features = ["codec"] }
# `model`: the coins model and its twin; `alloc-tag`: the tagging allocator the coins targets
# install (CH2 §6.5, §6.7); `crash`: the CRASH model's `ChainSut` and workloads.
dashd-chainstate = { path = "../dashd-chainstate", features = ["model", "alloc-tag", "crash"] }
dashd-store = { path = "../dashd-store", default-features = false, features = ["model", "rocksdb"] }
# P2a-net: the dial `sim` and the `connman_sched` check over it.
dashd-net = { path = "../dashd-net", features = ["sim"] }
# P3: `cmpct_reconstruct`'s and `block_download_model`'s checks (in its `sim` module).
dashd-p2p = { path = "../dashd-p2p", features = ["sim"] }
libfuzzer-sys = "0.4"
node-l1 = { path = "../node-l1", features = ["oracle"] }
node-sink = { path = "../node-sink" }

