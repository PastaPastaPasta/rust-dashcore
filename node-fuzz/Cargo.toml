# As the root: dash-coreimport's X11 is the dashpay fork's tag (coreimport_external_scan).
[patch.crates-io]
rs-x11-hash = { git = "https://github.com/dashpay/rs-x11-hash", tag = "0.1.9" }

[patch."https://github.com/dashpay/base-sdk"]
