[package]
name = "dashd-governance"
description = "The Rust Dash node's governance runtime: the governance lock, the published trigger view, collateral lookups through the transaction index, randomness and the chain-command seam"
publish = false
# Ports Dash Core code (MIT).
license = "MIT"
authors.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
# The serial executor and the non-`Sync` chain fakes, for this crate's dependents' tests.
testing = []

[dependencies]
arc-swap = "1.7"
dash-consensus = { path = "../dash-consensus" }
# The decoder of Core's `governance.dat`, shared by the importer and the own store.
dash-coreimport = { path = "../dash-coreimport" }
dash-dml = { path = "../dash-dml" }
dash-governance = { path = "../dash-governance" }
# `FastRandom` (Core's `FastRandomContext`) and the process `RandSource`.
dash-p2p = { path = "../dash-p2p" }
dash-primitives = { workspace = true, features = ["std"] }
dash-types = { workspace = true, features = ["std"] }
# IX1's `TxIndexReader` and `LocatedTx`.
dashd-indexes = { path = "../dashd-indexes" }
# `flatdb`, the store file's envelope and load outcomes.
dashd-masternode = { path = "../dashd-masternode", default-features = false }
tracing = { workspace = true }

[dev-dependencies]
# `testkit::numbered` masternodes, whose operator keys sign the tests' votes.
dash-dml = { path = "../dash-dml", features = ["test-utils"] }
dash-network = { path = "../dash-network" }
dash-params = { workspace = true, features = ["std"] }
dash-pkc = { workspace = true, features = ["bls"] }
# `tests/store.rs` compares imports with the RPC answers Core recorded (JSON, some gzipped).
flate2 = "1"
proptest = "1.11"
serde_json = "1.0"

[lints]
workspace = true
